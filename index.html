
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123c30">
<title>麻雀</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#102b24;color:white;
 font-family:Arial,"Noto Sans JP",sans-serif;user-select:none;
}
button{cursor:pointer;font:inherit}
header{text-align:center;padding:12px;background:#10251f}
h1{margin:0;color:#e5c77a;font-size:21px}
.menu{display:flex;justify-content:center;gap:8px;padding:9px;background:#193a30}
.menu button{
 padding:9px 15px;border:1px solid #80998b;
 border-radius:8px;background:#294e40;color:white;
}
.menu .active{background:#d2ae58;color:#172b22}
.status{
 text-align:center;padding:9px;color:#f1d98c;
 font-weight:bold;min-height:36px;
}
.table{
 position:relative;width:96%;max-width:480px;height:490px;
 margin:5px auto;
 background:radial-gradient(ellipse,#26815b,#125039);
 border:9px solid #704b2e;border-radius:24px;
 box-shadow:0 5px 18px #0008;overflow:hidden;
}
.player{
 position:absolute;display:flex;flex-direction:column;
 align-items:center;gap:4px;font-size:12px;
}
.name{color:#f5e3a8;font-weight:bold}
.top{top:43px;left:50%;transform:translateX(-50%)}
.left{left:5px;top:38%;width:30%}
.right{right:5px;top:38%;width:30%}
.bottom{
 bottom:7px;left:50%;transform:translateX(-50%);width:90%;
}
.backhand{display:flex;justify-content:center;gap:2px}
.back{
 width:11px;height:21px;border:1px solid #d4c08b;
 background:#286c50;border-radius:2px;
}
.river{
 display:flex;flex-wrap:wrap;justify-content:center;
 align-content:flex-start;gap:2px;width:100%;
 max-width:140px;min-height:20px;
}
.left .river,.right .river{max-width:110px}
.tile{
 flex:0 0 auto;width:clamp(21px,6.1vw,31px);
 height:clamp(38px,10vw,49px);
 background:#f5f0dc;color:#222;border:1px solid #b8ad91;
 border-radius:4px;display:flex;align-items:center;
 justify-content:center;font-size:clamp(13px,3.8vw,20px);
 font-weight:bold;box-shadow:0 2px 2px #0006;
}
.smalltile{width:17px;height:24px;font-size:11px}
.red{color:#c52b27}
.green{color:#168348}
.blue{color:#2566b4}
.selected{transform:translateY(-8px);border:2px solid #e9b94e}
.center{
 position:absolute;top:43%;left:50%;
 transform:translate(-50%,-50%);
 text-align:center;width:35%;pointer-events:none;
}
.round{color:#f6e5ad;font-size:16px}
.centerinfo{font-size:11px;margin-top:7px}
.dora-area{
 position:absolute;top:7px;left:50%;transform:translateX(-50%);
 display:flex;align-items:center;justify-content:center;
 gap:6px;z-index:2;white-space:nowrap;
}
.dora-label{font-size:11px;color:#f3dfa1;font-weight:bold}
.dora-tile{
 width:25px;height:35px;background:#f5f0dc;color:#2566b4;
 border:1px solid #b8ad91;border-radius:4px;
 display:flex;align-items:center;justify-content:center;
 font-size:16px;font-weight:bold;
}
.north-area{
 display:flex;justify-content:center;gap:3px;
 flex-wrap:wrap;min-height:20px;margin-top:3px;
}
.north-tile{
 background:#f5f0dc;color:#2566b4;border-radius:3px;
 padding:3px 5px;font-weight:bold;font-size:12px;
}
.log{
 margin:8px auto 220px;width:94%;max-width:460px;
 height:55px;overflow:auto;background:#172d26;
 border-radius:8px;padding:7px;font-size:11px;color:#c6d6c9;
}
.handarea{
 position:fixed;bottom:0;left:0;right:0;
 background:#172d26;padding:9px 3px calc(10px + env(safe-area-inset-bottom));
 border-top:2px solid #8b7047;z-index:5;
}
.handtitle{
 display:flex;justify-content:space-between;
 padding:0 7px 7px;font-size:12px;color:#e6d5a6;
}
.hand{
 display:flex;justify-content:center;gap:2px;
 overflow-x:auto;padding:4px 0 9px;
}
.hand .drawn-tile{
 margin-left:13px;
}
.actions,.subactions{
 display:flex;justify-content:center;gap:7px;flex-wrap:wrap;
}
.actions button{
 padding:10px 16px;border:0;border-radius:7px;
 background:#d1ae5e;color:#1c2c23;font-weight:bold;
}
.actions button:disabled{opacity:.35}
.actions .north-button{background:#397eaf;color:white;border:1px solid #9cc9e8}
.actions .riichi-button{background:#a83b3b;color:white}
.actions .win-button{background:#e4c66d;color:#182b21}
.actions .pass-button{background:#52645a;color:white}
.subactions{margin-top:7px}
.subactions button{
 padding:7px 12px;background:#345d4b;color:white;
 border:1px solid #8ca696;border-radius:7px;font-size:12px;
}
[hidden]{display:none!important}
@media(max-height:700px){
 .table{height:400px}.center{top:47%}.left,.right{top:39%}
}
@media(max-width:360px){
 .left,.right{width:29%}.center{width:34%}
 .smalltile{width:15px;height:22px;font-size:10px}
 .actions button{padding:9px 11px}
 .hand .drawn-tile{margin-left:10px}
}

<body>
<header>
<h1>🀄 麻雀 🀄</h1>
<small>MAHJONG</small>
</header>

<div class="menu">
<button id="four" class="active" onclick="setMode(4)">四人麻雀</button>
<button id="three" onclick="setMode(3)">三人麻雀</button>
</div>

<div class="status" id="status">対局準備中</div>

<div class="table">
 <div class="dora-area">
  <span class="dora-label">ドラ表示牌</span>
  <div class="dora-tile" id="doraIndicator">?</div>
 </div>

 <div class="player top" id="player3">
  <div class="name">CPU 3</div>
  <div class="backhand" id="back3"></div>
  <div class="north-area" id="north3"></div>
  <div class="river" id="river3"></div>
 </div>

 <div class="player left">
  <div class="name">CPU 1</div>
  <div class="backhand" id="back1"></div>
  <div class="north-area" id="north1"></div>
  <div class="river" id="river1"></div>
 </div>

 <div class="player right">
  <div class="name">CPU 2</div>
  <div class="backhand" id="back2"></div>
  <div class="north-area" id="north2"></div>
  <div class="river" id="river2"></div>
 </div>

 <div class="player bottom">
  <div class="river" id="river0"></div>
  <div class="north-area" id="north0"></div>
  <div class="name">あなた</div>
 </div>

 <div class="center">
  <div class="round" id="round">東一局</div>
  <div style="font-size:25px;margin:6px">🀄</div>
  <div id="wallinfo">残り牌：0</div>
  <div class="centerinfo" id="score">あなた 25000点</div>
 </div>
</div>

<div class="log" id="log">対局を開始してください。</div>

<div class="handarea">
 <div class="handtitle">
  <span>あなたの手牌</span>
  <span id="count">0枚</span>
 </div>

 <div class="hand" id="hand"></div>

 <div class="actions">
  <button id="northButton" class="north-button"
   onclick="playerNorth()" hidden>北抜き</button>

  <button id="riichiButton" class="riichi-button"
   onclick="playerRiichi()" hidden>リーチ</button>

  <button id="ronButton" class="win-button"
   onclick="playerRon()" hidden>ロン</button>

  <button id="tsumoButton" class="win-button"
   onclick="playerTsumo()" hidden>ツモ</button>

  <button id="passRonButton" class="pass-button"
   onclick="passRon()" hidden>見逃す</button>

  <button id="discard" onclick="playerDiscard()">打牌</button>
 </div>

 <div class="subactions">
  <button onclick="newGame()">新しい局</button>
  <button onclick="sortHand()">牌を整理</button>
 </div>
</div>

<script>
const honors=["東","南","西","北","白","發","中"];
const dragonTiles=["白","發","中"];

let mode=4;
let wall=[];
let hands=[];
let rivers=[];
let extracted=[];
let selected=-1;
let current=0;
let finished=false;
let busy=false;
let points=[];
let roundNo=1;
let gameToken=0;
let doraIndicator=null;
let riichi=[];
let riichiPending=false;
let riichiSticks=0;
let pendingRon=null;

/* ツモ牌そのものを保存する。並べ替えても位置を特定できる */
let drawnTile=[];

/* ロン見逃しによる一時フリテン */
let temporaryFuriten=[];

function activeSeats(){return mode===4?4:3}

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function makeWall(){
 let a=[];
 for(let s of ["m","p","s"]){
  let nums=mode===3&&s==="m"?[1,9]:[1,2,3,4,5,6,7,8,9];
  nums.forEach(n=>{for(let i=0;i<4;i++)a.push({s,n})});
 }
 honors.forEach(n=>{for(let i=0;i<4;i++)a.push({s:"z",n})});
 return shuffle(a);
}

function key(t){return t.s==="z"?"z"+t.n:t.s+t.n}
function label(t){
 if(t.s==="z")return t.n;
 return t.n+({m:"萬",p:"筒",s:"索"}[t.s]);
}
function color(t){
 if(t.s==="z")return "blue";
 if(t.s==="m")return "red";
 if(t.s==="s")return "green";
 return "";
}
function sortTiles(a){
 a.sort((x,y)=>{
  const order={m:0,p:1,s:2,z:3};
  if(order[x.s]!==order[y.s])return order[x.s]-order[y.s];
  if(x.s==="z")return honors.indexOf(x.n)-honors.indexOf(y.n);
  return x.n-y.n;
 });
}

function setMode(n){
 mode=n;
 document.getElementById("four").classList.toggle("active",n===4);
 document.getElementById("three").classList.toggle("active",n===3);
 points=Array(activeSeats()).fill(25000);
 newGame();
}

function status(s){document.getElementById("status").textContent=s}
function log(s){
 const e=document.getElementById("log");
 if(!e)return;
 e.innerHTML+=s+"<br>";
 e.scrollTop=e.scrollHeight;
}

function newGame(){
 gameToken++;
 const token=gameToken;
 wall=makeWall();
 doraIndicator=wall.pop();

 hands=Array.from({length:activeSeats()},()=>[]);
 rivers=Array.from({length:activeSeats()},()=>[]);
 extracted=Array.from({length:activeSeats()},()=>[]);
 riichi=Array(activeSeats()).fill(false);
 drawnTile=Array(activeSeats()).fill(null);
 temporaryFuriten=Array(activeSeats()).fill(false);

 selected=-1;
 current=0;
 finished=false;
 busy=true;
 riichiPending=false;
 pendingRon=null;

 if(points.length!==activeSeats())points=Array(activeSeats()).fill(25000);

 for(let i=0;i<13;i++){
  for(let p=0;p<activeSeats();p++)hands[p].push(wall.pop());
 }
 hands.forEach(sortTiles);

 document.getElementById("log").innerHTML="";
 log("新しい局を開始しました。");
 document.getElementById("player3").style.display=mode===4?"flex":"none";
 document.getElementById("doraIndicator").textContent=label(doraIndicator);

 status("あなたが自動ツモ中...");
 update();

 setTimeout(()=>{
  if(token!==gameToken||finished)return;
  if(!drawFor(0)){endGame("流局です。");return}
  busy=false;
  selected=-1;
  sortTiles(hands[0]);
  log("あなたが自動ツモしました。");
  status("あなたの番です。牌を選んでください。");
  update();
 },400);
}

function drawFor(p){
 if(wall.length===0)return false;
 const t=wall.pop();
 hands[p].push(t);
 drawnTile[p]=t;
 if(p===0)temporaryFuriten[p]=false;
 return true;
}

function drawnIndex(p){
 if(!drawnTile[p])return -1;
 return hands[p].indexOf(drawnTile[p]);
}

/* 手牌のアガリ形を調べる */
function getAgariPatterns(hand){
 if(hand.length!==14)return [];
 const counts={};
 const tiles={};
 hand.forEach(t=>{
  const k=key(t);
  counts[k]=(counts[k]||0)+1;
  tiles[k]=t;
 });

 const keys=Object.keys(counts);
 const patterns=[];

 if(keys.length===7&&keys.every(k=>counts[k]===2)){
  patterns.push({sevenPairs:true,groups:[]});
 }

 for(const pair of keys){
  if(counts[pair]<2)continue;
  counts[pair]-=2;
  const groups=[];
  if(makeMelds(counts,tiles,groups)){
   patterns.push({
    sevenPairs:false,
    pair:tiles[pair],
    groups:groups.slice()
   });
  }
  counts[pair]+=2;
 }
 return patterns;
}

function makeMelds(counts,tiles,groups){
 const keys=Object.keys(counts).filter(k=>counts[k]>0);
 if(keys.length===0)return true;

 keys.sort((a,b)=>tileOrder(tiles[a])-tileOrder(tiles[b]));
 const k=keys[0];
 const t=tiles[k];

 if(counts[k]>=3){
  counts[k]-=3;
  groups.push({type:"triplet",tile:t});
  if(makeMelds(counts,tiles,groups))return true;
  groups.pop();
  counts[k]+=3;
 }

 if(t.s!=="z"&&t.n<=7){
  const k2=t.s+(t.n+1);
  const k3=t.s+(t.n+2);
  if(counts[k2]>0&&counts[k3]>0){
   counts[k]--;
   counts[k2]--;
   counts[k3]--;
   groups.push({type:"sequence",tile:t});
   if(makeMelds(counts,tiles,groups))return true;
   groups.pop();
   counts[k]++;
   counts[k2]++;
   counts[k3]++;
  }
 }
 return false;
}

function tileOrder(t){
 const order={m:0,p:1,s:2,z:3};
 return order[t.s]*100+(t.s==="z"?honors.indexOf(t.n):t.n);
}

function isSimple(t){return t.s!=="z"&&t.n>=2&&t.n<=8}
function seatWind(p){return ["東","南","西","北"][p]||"東"}

function getYaku(hand,pattern,p,isTsumo){
 const found=[];
 if(riichi[p])found.push("リーチ");
 if(isTsumo&&!riichi[p])found.push("門前ツモ");

 if(hand.every(isSimple))found.push("タンヤオ");

 if(!pattern.sevenPairs){
  pattern.groups.forEach(g=>{
   if(g.type!=="triplet"||g.tile.s!=="z")return;
   if(dragonTiles.includes(g.tile.n))found.push("役牌 "+g.tile.n);
   if(g.tile.n===seatWind(p))found.push("自風牌");
   if(g.tile.n==="東")found.push("場風牌");
  });
 }

 return [...new Set(found)];
}

function canAgari(hand,extra,p,isTsumo){
 const full=extra?[...hand,extra]:hand.slice();
 if(full.length!==14)return null;

 const patterns=getAgariPatterns(full);
 for(const pattern of patterns){
  const yaku=getYaku(full,pattern,p,isTsumo);
  if(yaku.length)return {pattern,yaku,hand:full};
 }
 return null;
}

function allPossibleTiles(){
 const a=[];
 for(const s of ["m","p","s"]){
  const nums=mode===3&&s==="m"?[1,9]:[1,2,3,4,5,6,7,8,9];
  nums.forEach(n=>a.push({s,n}));
 }
 honors.forEach(n=>a.push({s:"z",n}));
 return a;
}

function isTenpai(hand,p){
 if(hand.length!==13)return false;
 return calculateShanten(hand)===0;
}

/*
 シャンテン数計算。
 面子・塔子・雀頭の組み合わせを探索し、
 通常手と七対子のうち良い方を採用する。
*/
function calculateShanten(hand){
 const counts=Array(34).fill(0);

 hand.forEach(t=>{
  const i=tileIndex(t);
  if(i>=0)counts[i]++;
 });

 let best=8;
 const memo=new Map();

 function dfs(melds,taatsu,pair){
  while(melds>4)melds=4;
  if(taatsu>4-melds)taatsu=4-melds;

  let i=counts.findIndex(v=>v>0);
  if(i===-1){
   const value=8-melds*2-taatsu-pair;
   if(value<best)best=value;
   return;
  }

  const state=counts.join("")+"|"+melds+"|"+taatsu+"|"+pair;
  if(memo.has(state))return;
  memo.set(state,true);

  /* 1枚を孤立牌として使わない */
  counts[i]--;
  dfs(melds,taatsu,pair);
  counts[i]++;

  /* 刻子 */
  if(counts[i]>=3&&melds<4){
   counts[i]-=3;
   dfs(melds+1,taatsu,pair);
   counts[i]+=3;
  }

  /* 順子 */
  if(i<27&&i%9<=6&&counts[i+1]>0&&counts[i+2]>0&&melds<4){
   counts[i]--;
   counts[i+1]--;
   counts[i+2]--;
   dfs(melds+1,taatsu,pair);
   counts[i]++;
   counts[i+1]++;
   counts[i+2]++;
  }

  /* 雀頭または対子塔子 */
  if(counts[i]>=2){
   counts[i]-=2;
   if(pair===0)dfs(melds,taatsu,1);
   else dfs(melds,taatsu+1,pair);
   counts[i]+=2;
  }

  /* 両面・嵌張・辺張 */
  if(i<27&&i%9<=7&&counts[i+1]>0){
   counts[i]--;
   counts[i+1]--;
   dfs(melds,taatsu+1,pair);
   counts[i]++;
   counts[i+1]++;
  }

  if(i<27&&i%9<=6&&counts[i+2]>0){
   counts[i]--;
   counts[i+2]--;
   dfs(melds,taatsu+1,pair);
   counts[i]++;
   counts[i+2]++;
  }
 }

 dfs(0,0,0);

 /* 七対子シャンテン */
 let pairs=0;
 let unique=0;
 counts.forEach(c=>{
  if(c>0)unique++;
  if(c>=2)pairs++;
 });
 const chiitoi=6-pairs+Math.max(0,7-unique);

 return Math.min(best,chiitoi);
}

function tileIndex(t){
 if(t.s==="m")return t.n-1;
 if(t.s==="p")return 9+t.n-1;
 if(t.s==="s")return 18+t.n-1;
 return 27+honors.indexOf(t.n);
}

function canRiichiAfterDiscard(hand,index,p){
 if(riichi[p]||points[p]<1000||hand.length!==14||index<0)return false;
 const test=hand.slice();
 test.splice(index,1);
 return isTenpai(test,p);
}

function update(){
 const el=document.getElementById("hand");
 if(!el)return;
 el.innerHTML="";

 /* ツモ牌以外を先に表示 */
 const drawn=drawnTile[0];
 hands[0].forEach((t,i)=>{
  if(t===drawn)return;
  const d=document.createElement("div");
  d.className="tile "+color(t)+(selected===i?" selected":"");
  d.textContent=label(t);
  d.onclick=()=>{
   if(current!==0||busy||finished||pendingRon||hands[0].length!==14)return;
   if(riichi[0]&&i!==drawnIndex(0))return;
   selected=i;
   update();
  };
  el.appendChild(d);
 });

 /* ツモ牌は右端に独立して表示 */
 if(drawn&&hands[0].includes(drawn)){
  const i=hands[0].indexOf(drawn);
  const d=document.createElement("div");
  d.className="tile "+color(drawn)+" drawn-tile"+(selected===i?" selected":"");
  d.textContent=label(drawn);
  d.onclick=()=>{
   if(current!==0||busy||finished||pendingRon||hands[0].length!==14)return;
   selected=i;
   update();
  };
  el.appendChild(d);
 }

 document.getElementById("count").textContent=hands[0].length+"枚";
 document.getElementById("wallinfo").textContent="残り牌："+wall.length;
 document.getElementById("score").textContent="あなた "+points[0]+"点";
 document.getElementById("round").textContent=
  "東"+["一","二","三","四"][(roundNo-1)%4]+"局";

 for(let p=0;p<activeSeats();p++){
  const river=document.getElementById("river"+p);
  if(river){
   river.innerHTML="";
   rivers[p].forEach(t=>{
    const d=document.createElement("div");
    d.className="tile smalltile "+color(t);
    d.textContent=label(t);
    river.appendChild(d);
   });
  }
 }

 for(let p=1;p<4;p++){
  const backs=document.getElementById("back"+p);
  const north=document.getElementById("north"+p);

  if(backs){
   backs.innerHTML="";
   if(p<activeSeats()){
    hands[p].forEach(()=>{
     const b=document.createElement("div");
     b.className="back";
     backs.appendChild(b);
    });
   }
  }

  if(north){
   north.innerHTML="";
   if(p<activeSeats()){
    extracted[p].forEach(()=>{
     const d=document.createElement("div");
     d.className="north-tile";
     d.textContent="北";
     north.appendChild(d);
    });
   }
  }
 }

 const northArea=document.getElementById("north0");
 northArea.innerHTML="";
 extracted[0].forEach(()=>{
  const d=document.createElement("div");
  d.className="north-tile";
  d.textContent="北";
  northArea.appendChild(d);
 });

 const hasNorth=hands[0].some(isNorth);
 const northButton=document.getElementById("northButton");
 northButton.hidden=!(mode===3&&hasNorth&&!riichi[0]);
 northButton.disabled=finished||busy||current!==0||hands[0].length!==14;

 const riichiButton=document.getElementById("riichiButton");
 const riichiPossible=selected>=0&&canRiichiAfterDiscard(hands[0],selected,0);
 riichiButton.hidden=riichi[0]||!riichiPossible||pendingRon;
 riichiButton.disabled=finished||busy||current!==0;

 const tsumo=hands[0].length===14?canAgari(hands[0],null,0,true):null;
 document.getElementById("tsumoButton").hidden=!tsumo||pendingRon;
 document.getElementById("ronButton").hidden=!(pendingRon&&pendingRon.player===0);
 document.getElementById("passRonButton").hidden=!(pendingRon&&pendingRon.player===0);

 document.getElementById("discard").disabled=
  finished||busy||current!==0||pendingRon||
  hands[0].length!==14||selected<0||
  (riichi[0]&&selected!==drawnIndex(0));
}

function isNorth(t){return t.s==="z"&&t.n==="北"}

function playerNorth(){
 if(mode!==3||finished||busy||riichi[0]||current!==0||
    hands[0].length!==14||pendingRon)return;

 const index=hands[0].findIndex(isNorth);
 if(index<0)return;

 const removed=hands[0].splice(index,1)[0];
 if(removed===drawnTile[0])drawnTile[0]=null;

 extracted[0].push({s:"z",n:"北"});
 selected=-1;

 log("あなた：北を抜きました。");
 status("北抜きの補充牌をツモします。");
 update();

 if(!drawFor(0)){endGame("補充牌がありません。流局です。");return}
 sortTiles(hands[0]);
 log("北抜きの補充牌をツモしました。");
 status("あなたの番です。");
 update();
}

function playerRiichi(){
 if(selected<0||!canRiichiAfterDiscard(hands[0],selected,0))return;
 if(riichi[0]||points[0]<1000)return;

 riichiPending=true;
 status("リーチを宣言します。選択した牌を捨ててください。");
 log("あなた：リーチ！");
 update();
}

function playerDiscard(){
 if(finished||busy||current!==0||pendingRon||
    hands[0].length!==14||selected<0)return;
 if(riichi[0]&&selected!==drawnIndex(0))return;

 if(riichiPending){
  if(!canRiichiAfterDiscard(hands[0],selected,0))return;
  points[0]-=1000;
  riichiSticks++;
  riichi[0]=true;
  riichiPending=false;
  log("あなた：リーチ成立。1000点を供託しました。");
 }

 const t=hands[0].splice(selected,1)[0];
 drawnTile[0]=null;
 rivers[0].push(t);
 selected=-1;
 busy=true;
 log("あなた："+label(t)+"を打牌");
 status("CPUが対局中...");
 update();

 afterDiscard(0,t,gameToken);
}

/* CPUの打牌選択。シャンテン数を優先して牌を選ぶ */
function chooseDiscard(h,p){
 if(riichi[p]){
  const index=drawnIndex(p);
  return index>=0?index:h.length-1;
 }

 let best=0;
 let bestScore=Infinity;

 for(let i=0;i<h.length;i++){
  const test=h.slice();
  const t=test.splice(i,1)[0];

  const shanten=calculateShanten(test);

  const same=test.filter(q=>key(q)===key(t)).length;
  let keepValue=0;

  /* 対子・近い数牌は残す */
  if(same>=1)keepValue+=8;

  if(t.s==="z"){
   if(same===0)keepValue-=2;
   else keepValue+=4;
  }else{
   let near=0;
   for(const q of test){
    if(q.s===t.s&&Math.abs(q.n-t.n)===1)near+=2;
    else if(q.s===t.s&&Math.abs(q.n-t.n)===2)near++;
   }
   keepValue+=near;
   if(t.n===1||t.n===9)keepValue-=1;
  }

  /* シャンテン数を最優先、同じなら不要牌を捨てる */
  const score=shanten*100-keepValue+Math.random()*0.1;

  if(score<bestScore){
   bestScore=score;
   best=i;
  }
 }
 return best;
}

function cpuNorth(p){
 if(mode!==3||riichi[p])return false;
 const index=hands[p].findIndex(isNorth);
 if(index<0)return false;
 const removed=hands[p].splice(index,1)[0];
 if(removed===drawnTile[p])drawnTile[p]=null;
 extracted[p].push({s:"z",n:"北"});
 log("CPU "+p+"：北を抜きました。");
 if(!drawFor(p))return false;
 return true;
}

function cpuTurn(token){
 if(token!==gameToken||finished||pendingRon)return;
 try{
  const p=current;
  if(p>=activeSeats()){startPlayerTurn();return}

  if(!drawFor(p)){endGame("山牌がなくなりました。流局です。");return}
  sortTiles(hands[p]);

  if(mode===3&&!riichi[p]){
   let guard=0;
   while(hands[p].some(isNorth)&&guard<4){
    guard++;
    if(!cpuNorth(p)){
     endGame("補充牌がなくなりました。流局です。");
     return;
    }
    sortTiles(hands[p]);
   }
  }

  const tsumo=canAgari(hands[p],null,p,true);
  if(tsumo){
   winGame(p,"ツモ",tsumo);
   return;
  }

  const i=chooseDiscard(hands[p],p);
  const t=hands[p].splice(i,1)[0];
  drawnTile[p]=null;
  rivers[p].push(t);
  log("CPU "+p+"："+label(t)+"を打牌");

  /* 13枚で聴牌していればリーチ */
  if(!riichi[p]&&points[p]>=1000&&isTenpai(hands[p],p)){
   riichi[p]=true;
   points[p]-=1000;
   riichiSticks++;
   log("CPU "+p+"：リーチ！");
  }

  update();
  afterDiscard(p,t,token);

 }catch(error){
  console.error(error);
  endGame("CPU処理でエラーが発生しました。新しい局を開始してください。");
 }
}

/* 捨て牌に対するロン判定 */
function afterDiscard(discarder,t,token){
 if(token!==gameToken||finished)return;

 for(let step=1;step<activeSeats();step++){
  const p=(discarder+step)%activeSeats();

  /* 一時フリテン中はロンできない */
  if(p===0&&temporaryFuriten[0])continue;

  const result=canAgari(hands[p],t,p,false);
  if(!result)continue;

  if(p===0){
   pendingRon={player:0,discarder,tile:t,result,token};
   busy=false;
   status("ロンできます！");
   log("ロンできる牌が出ました。");
   update();
   return;
  }else{
   winGame(p,"ロン",result);
   return;
  }
 }

 advanceTurn(discarder,token);
}

/* 次のプレイヤーへ進む */
function advanceTurn(discarder,token){
 if(token!==gameToken||finished)return;

 current=(discarder+1)%activeSeats();

 if(current===0){
  setTimeout(()=>{
   if(token===gameToken)startPlayerTurn();
  },350);
 }else{
  busy=true;
  setTimeout(()=>{
   if(token===gameToken)cpuTurn(token);
  },450);
 }
}

function playerRon(){
 if(!pendingRon||pendingRon.player!==0||finished)return;
 const r=pendingRon.result;
 pendingRon=null;
 winGame(0,"ロン",r);
}

/*
 ロンを見逃した場合：
 一時フリテンにし、見逃した人より後のCPUにも
 ロンできる牌かどうかを確認してから手番を進める。
*/
function passRon(){
 if(!pendingRon||pendingRon.player!==0)return;

 const discarder=pendingRon.discarder;
 const token=pendingRon.token;

 pendingRon=null;
 temporaryFuriten[0]=true;

 log("あなた：ロンを見逃しました。一時フリテンです。");
 status("ロンを見逃しました。");

 /* 見逃したプレイヤーより後のCPUのロンを確認 */
 for(let step=1;step<activeSeats();step++){
  const p=(0+step)%activeSeats();
  if(p===discarder)break;

  const result=canAgari(hands[p],rivers[discarder][rivers[discarder].length-1],p,false);
  if(result){
   winGame(p,"ロン",result);
   return;
  }
 }

 busy=true;
 update();
 advanceTurn(discarder,token);
}

function playerTsumo(){
 if(finished||busy||current!==0||pendingRon)return;
 const result=canAgari(hands[0],null,0,true);
 if(!result)return;
 winGame(0,"ツモ",result);
}

function winGame(winner,type,result){
 if(finished)return;
 finished=true;
 busy=false;
 pendingRon=null;
 riichiPending=false;

 const bonus=riichiSticks*1000;
 points[winner]+=bonus;
 riichiSticks=0;

 const yaku=result.yaku.join("・");
 const who=winner===0?"あなた":"CPU "+winner;
 const message=who+"の"+type+"！ 役："+yaku;

 status(message);
 log("🎉 "+message);
 if(bonus>0)log("リーチ供託点 "+bonus+"点を獲得しました。");
 update();
}

function startPlayerTurn(){
 if(finished)return;
 current=0;
 if(!drawFor(0)){endGame("山牌がなくなりました。流局です。");return}

 sortTiles(hands[0]);
 selected=-1;
 busy=false;
 log("あなたが自動ツモしました。");

 const tsumo=canAgari(hands[0],null,0,true);
 if(tsumo){
  status("ツモできます！");
 }else{
  status("あなたの番です。牌を選んでください。");
 }
 update();
}

function sortHand(){
 if(finished||busy||pendingRon||riichi[0])return;
 sortTiles(hands[0]);
 selected=-1;
 update();
}

function endGame(s){
 finished=true;
 busy=false;
 pendingRon=null;
 status(s);
 log(s);
 update();
}

newGame();
</script>
