<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123c30">
<title>麻雀</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102b24;color:white;font-family:Arial,"Noto Sans JP",sans-serif;user-select:none}
button{cursor:pointer;font:inherit}
[hidden]{display:none!important}
.start-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:25px;background:radial-gradient(ellipse,#26815b,#102b24)}
.start-title{font-size:24px;color:#f1d98c;font-weight:bold}
.start-subtitle{font-size:13px;color:#c6d6c9}
.mode-select{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.mode-select button{padding:17px;border:2px solid #d2ae58;border-radius:12px;background:#294e40;color:white;font-size:18px;font-weight:bold}
.status{text-align:center;padding:9px;color:#f1d98c;font-weight:bold;min-height:36px}

.table{
 position:relative;width:96%;max-width:480px;
 height:min(610px,calc(100dvh - 340px));min-height:440px;
 margin:5px auto;
 background:radial-gradient(ellipse,#087b50,#005638 75%,#06432f);
 border:10px solid #704b2e;border-radius:30px;
 box-shadow:0 5px 18px #0008,inset 0 0 18px #0003;
 overflow:hidden
}

/* プレイヤー情報 */
.player{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;z-index:3}
.name{color:#f5e3a8;font-weight:bold;white-space:nowrap}
.top{top:8px;left:50%;transform:translateX(-50%)}
.left{left:2px;top:35%;width:17%;align-items:flex-start}
.right{right:2px;top:35%;width:17%;align-items:flex-end}
.bottom{bottom:7px;left:50%;transform:translateX(-50%);width:95%}

/* 名前の向き */
.top .name{transform:rotate(180deg)}
.left .name{transform:rotate(90deg);transform-origin:left center;margin-left:5px}
.right .name{transform:rotate(-90deg);transform-origin:right center;margin-right:5px}

/* 点数表示：全員同じ大きさ・書式 */
.player-score{
 color:#fff2c1;font-size:13px;font-weight:bold;
 line-height:1.2;white-space:nowrap;text-shadow:0 1px 3px #000;
 padding:2px 5px
}
.top .player-score{transform:rotate(180deg)}
.left .player-score{transform:rotate(90deg);transform-origin:left center;margin-left:5px}
.right .player-score{transform:rotate(-90deg);transform-origin:right center;margin-right:5px}
.bottom .player-score{font-size:13px;text-align:center}

/* CPUの手牌 */
.backhand{display:flex;justify-content:center;gap:3px;align-items:center;min-height:19px;flex-wrap:nowrap}
.back{width:14px;height:10px;border:1px solid #e2c77e;background:linear-gradient(135deg,#dba94b,#a66c24);border-radius:3px;flex:0 0 14px;box-shadow:0 1px 2px #0008}
.top .backhand{transform:rotate(180deg)}
.left .backhand{
 transform:rotate(90deg);transform-origin:left center;
 margin:8px 0 8px 0;justify-content:flex-start;
 transform:translateX(-5px) rotate(90deg);transform-origin:left center
}
.right .backhand{
 transform:translateX(5px) rotate(-90deg);transform-origin:right center;
 margin:8px 0;justify-content:flex-end
}
.left .north-area,.left .meld-area{justify-content:flex-start}
.right .north-area,.right .meld-area{justify-content:flex-end}

/* 捨て牌：プレイヤー情報とは独立して配置 */
.river{
 position:absolute;display:flex;flex-wrap:wrap;justify-content:center;
 align-content:flex-start;gap:2px;min-height:70px;z-index:2;
 pointer-events:none
}
#river3{top:22%;left:50%;transform:translateX(-50%);width:58%;max-width:none}
#river1{top:50%;left:2%;transform:translateY(-50%);width:31%;max-width:none}
#river2{top:50%;right:2%;transform:translateY(-50%);width:31%;max-width:none}
#river0{bottom:22%;left:50%;transform:translateX(-50%);width:58%;max-width:none}

/* 牌のデザイン */
.tile{
 flex:0 0 auto;width:clamp(25px,6.5vw,34px);height:clamp(42px,11vw,53px);
 background:linear-gradient(110deg,#fffefb,#f5f0e5);color:#222;
 border:1px solid #c5c5c5;border-bottom:3px solid #b8b8b8;
 border-radius:4px;display:flex;align-items:center;justify-content:center;
 font-weight:bold;box-shadow:0 2px 3px #0007;position:relative;overflow:hidden
}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#b87918,#f2cf65,#b87918);z-index:2}
.tile-face{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1}
.tile-number{font-size:clamp(12px,3.2vw,17px);font-weight:900}
.tile-suit{font-size:clamp(13px,3.6vw,19px);font-weight:900}
.tile-honor{font-size:clamp(18px,4.5vw,24px);font-weight:900}
.tile-honor.white{color:#1764b0}
.tile-honor.green{color:#14834a}
.tile-honor.red{color:#c52b27}
.tile-symbols{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:85%;height:85%;place-items:center}
.circle-symbol{width:65%;aspect-ratio:1;border-radius:50%;border:1.5px solid #225ca5;background:radial-gradient(circle at 35% 30%,#fff 0 15%,#4278bb 35%,#173f83 75%)}
.circle-symbol.red-center{background:radial-gradient(circle at 35% 30%,#fff 0 15%,#d64a42 35%,#9d1717 75%);border-color:#a61f1f}
.bamboo-symbol{width:45%;height:85%;border-radius:5px;background:linear-gradient(90deg,#064c30,#25a264 35%,#08713d 70%,#064c30);border:1px solid #064c30;position:relative}
.bamboo-symbol:before,.bamboo-symbol:after{content:"";position:absolute;left:0;right:0;height:2px;background:#d6e8c8}
.bamboo-symbol:before{top:30%}
.bamboo-symbol:after{top:65%}
.smalltile{width:17px;height:25px;font-size:10px;border-radius:3px}
.smalltile .tile-number{font-size:8px}
.smalltile .tile-suit{font-size:10px}
.smalltile .tile-honor{font-size:13px}
.smalltile .tile-symbols{width:90%;height:90%}
.smalltile .circle-symbol{width:65%;border-width:1px}
.selected{transform:translateY(-8px);border:2px solid #e9b94e}
.riichi-discard{transform:rotate(90deg);margin:5px 3px}

/* ドラ表示：見やすく拡大 */
.dora-area{
 position:absolute;top:8px;left:8px;display:flex;align-items:center;
 gap:7px;z-index:5;white-space:nowrap
}
.dora-label{font-size:12px;color:#f3dfa1;font-weight:bold}
.dora-tile{
 width:40px;height:56px;background:linear-gradient(110deg,#fffef4,#f3edda);
 color:#2566b4;border:1px solid #b8ad91;border-bottom:3px solid #b8a98a;
 border-radius:5px;display:flex;align-items:center;justify-content:center;
 font-size:19px;font-weight:bold
}
.dora-tile .tile-number{font-size:16px}
.dora-tile .tile-suit{font-size:19px}
.dora-tile .tile-honor{font-size:24px}

/* 本場・供託：ドラ表示の真下 */
.round-counter{
 position:absolute;top:70px;left:8px;z-index:5;
 display:flex;flex-direction:column;gap:4px;
 color:#f6e5ad;font-size:12px;font-weight:bold;
 white-space:nowrap;text-shadow:0 1px 3px #000;
 background:#123c30b8;padding:4px 6px;border-radius:5px
}
.round-counter span{display:block}

.north-area,.meld-area{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;min-height:20px;margin:3px 0}
.north-tile{background:linear-gradient(110deg,#fffef4,#f3edda);color:#2566b4;border:1px solid #b8ad91;border-radius:3px;padding:3px 5px;font-weight:bold;font-size:12px}
.meld-area{align-items:center}
.meld-group{display:flex;gap:2px;padding:2px;border:1px solid #d5bd7b;border-radius:4px;background:#173b2e}
.meld-tile{width:24px;height:34px;background:linear-gradient(110deg,#fffef4,#f3edda);color:#222;border:1px solid #b8ad91;border-bottom:2px solid #b8a98a;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;overflow:hidden}
.meld-tile .tile-number{font-size:10px}
.meld-tile .tile-suit{font-size:13px}
.meld-tile .tile-honor{font-size:16px}
#meld0{position:absolute;right:0;bottom:0;justify-content:flex-end;max-width:55%;z-index:3}

/* 中央表示 */
.center{position:absolute;top:51%;left:50%;transform:translate(-50%,-50%);text-align:center;width:34%;pointer-events:none;z-index:1}
.round{color:#f6e5ad;font-size:19px;font-weight:bold}
.centerinfo{font-size:13px;margin-top:7px}

/* 手牌エリア */
.handarea{position:fixed;bottom:0;left:0;right:0;background:#172d26;padding:9px 3px calc(10px + env(safe-area-inset-bottom));border-top:2px solid #8b7047;z-index:5}
.handtitle{display:flex;justify-content:space-between;padding:0 7px 7px;font-size:14px;color:#e6d5a6}
.hand{display:flex;justify-content:center;gap:2px;overflow-x:auto;padding:4px 0 9px}
.hand .drawn-tile{margin-left:13px}
.actions,.call-actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.actions button,.call-actions button{padding:9px 13px;border:0;border-radius:7px;background:#d1ae5e;color:#1c2c23;font-weight:bold}
.actions button:disabled{opacity:.35}
.actions .north-button{background:#397eaf;color:white}
.actions .riichi-button{background:#a83b3b;color:white}
.actions .win-button{background:#e4c66d}
.actions .pass-button,.call-actions .skip-call{background:#52645a;color:white}
.call-actions{margin-bottom:7px}

/* メニュー */
.top-menu{position:fixed;top:8px;right:10px;z-index:50}
.top-menu-button{padding:9px 14px;border:1px solid #d2ae58;border-radius:8px;background:#294e40;color:white;font-weight:bold}
.menu-panel{position:absolute;top:43px;right:0;width:160px;padding:8px;background:#173b2e;border:1px solid #d2ae58;border-radius:10px}
.menu-panel button{display:block;width:100%;margin:4px 0;padding:10px;border:0;border-radius:6px;background:#345d4b;color:white;font-size:13px}

/* 通知・結果 */
.notice{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);width:85%;max-width:340px;padding:22px 16px;border:3px solid #f1d06b;border-radius:16px;background:linear-gradient(135deg,#8d2525,#501616);color:white;text-align:center;font-size:25px;font-weight:bold;z-index:100}
.result-panel{position:fixed;z-index:110;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:390px;max-height:75vh;overflow-y:auto;padding:20px;border:2px solid #e6c66d;border-radius:16px;background:linear-gradient(145deg,#244d3c,#142c23);box-shadow:0 8px 35px #000c}
.result-title{text-align:center;font-size:24px;font-weight:bold;color:#f5d77d;margin-bottom:12px}
.result-main{text-align:center;font-size:17px;font-weight:bold;margin-bottom:8px}
.result-detail{text-align:center;color:#f5e4b4;font-size:14px;line-height:1.8;margin-bottom:12px}
.result-line{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.result-close{display:block;width:100%;margin-top:15px;padding:11px;border:0;border-radius:8px;background:#d1ae5e;color:#1c2c23;font-weight:bold}

@media(max-height:700px){
 .table{height:440px;min-height:400px}
}
@media(max-width:380px){
 .left,.right{width:16%}
 .center{width:32%}
 .actions button{padding:8px 9px}
 .hand .drawn-tile{margin-left:8px}
 .tile{width:clamp(23px,6.1vw,29px)}
 .round-counter{font-size:10px}
 #river1{width:30%;left:1%}
 #river2{width:30%;right:1%}
 .player-score{font-size:13px}
 .dora-tile{width:38px;height:53px}
}
</style>
</head>
<body>

<div class="start-screen" id="startScreen">
 <div class="start-title">対局モードを選択</div>
 <div class="start-subtitle">プレイする麻雀の種類を選んでください</div>
 <div class="mode-select" id="playerModeOptions">
  <button onclick="setMode(4)">四人麻雀</button>
  <button onclick="setMode(3)">三人麻雀</button>
 </div>
 <div id="lengthOptions" hidden>
  <div class="start-subtitle">対局形式を選択</div>
  <div class="mode-select">
   <button onclick="setLength(4)">東風戦</button>
   <button onclick="setLength(8)">半荘戦</button>
  </div>
 </div>
</div>

<div class="notice" id="notice" hidden>リーチ！<span id="noticeSub" style="display:block;font-size:13px;margin-top:8px"></span></div>

<div class="result-panel" id="resultPanel" hidden>
 <div class="result-title" id="resultTitle">和了！</div>
 <div id="resultBody"></div>
 <button class="result-close" onclick="closeResult()">次の局へ</button>
</div>

<div id="gameScreen" hidden>
 <div class="top-menu">
  <button class="top-menu-button" onclick="toggleMenu()">☰ メニュー</button>
  <div class="menu-panel" id="menuPanel" hidden>
   <button onclick="newGame();toggleMenu()">新しい局</button>
   <button onclick="sortHand();toggleMenu()">牌を整理</button>
   <button onclick="returnToMenu()">モード選択</button>
  </div>
 </div>

 <div class="status" id="status"></div>

 <div class="table">
  <div class="dora-area">
   <span class="dora-label">表示牌</span>
   <div class="dora-tile" id="doraIndicator">?</div>
  </div>

  <div class="round-counter">
   <span id="honbaDisplay">0本場</span>
   <span id="riichiDisplay">供託 0本</span>
  </div>

  <!-- 上：CPU3 -->
  <div class="player top" id="player3">
   <div class="name">CPU 3（北）</div>
   <div class="player-score" id="playerScore3">25000点</div>
   <div class="backhand" id="back3"></div>
   <div class="north-area" id="north3"></div>
   <div class="meld-area" id="meld3"></div>
  </div>

  <!-- 左：CPU1 -->
  <div class="player left">
   <div class="name">CPU 1（西）</div>
   <div class="player-score" id="playerScore1">25000点</div>
   <div class="backhand" id="back1"></div>
   <div class="north-area" id="north1"></div>
   <div class="meld-area" id="meld1"></div>
  </div>

  <!-- 右：CPU2 -->
  <div class="player right">
   <div class="name">CPU 2（南）</div>
   <div class="player-score" id="playerScore2">25000点</div>
   <div class="backhand" id="back2"></div>
   <div class="north-area" id="north2"></div>
   <div class="meld-area" id="meld2"></div>
  </div>

  <!-- 下：あなた -->
  <div class="player bottom">
   <div class="north-area" id="north0"></div>
   <div class="meld-area" id="meld0"></div>
   <div class="name">あなた（東）</div>
   <div class="player-score" id="playerScore0">25000点</div>
  </div>

  <!-- 捨て牌は4人ともテーブル直下に配置 -->
  <div class="river" id="river3"></div>
  <div class="river" id="river1"></div>
  <div class="river" id="river2"></div>
  <div class="river" id="river0"></div>

  <div class="center">
   <div class="round" id="round">東一局</div>
   <div style="font-size:25px;margin:6px">🀄</div>
   <div id="wallinfo">残り牌：0</div>
  </div>
 </div>

 <div class="handarea">
  <div class="handtitle">
   <span>あなたの手牌</span>
   <span id="count">0枚</span>
  </div>
  <div class="hand" id="hand"></div>
  <div class="call-actions" id="callActions" hidden>
   <button id="ponButton" onclick="playerCall('pon')">ポン</button>
   <button id="kanButton" onclick="playerCall('kan')">大明槓</button>
   <button id="chiButton" onclick="playerCall('chi')">チー</button>
   <button class="skip-call" onclick="skipCall()">スキップ</button>
  </div>
  <div class="actions">
   <button id="northButton" class="north-button" onclick="playerNorth()" hidden>北抜き</button>
   <button id="ankanButton" onclick="playerAnkan()" hidden>暗槓</button>
   <button id="riichiButton" class="riichi-button" onclick="playerRiichi()" hidden>リーチ</button>
   <button id="ronButton" class="win-button" onclick="playerRon()" hidden>ロン</button>
   <button id="tsumoButton" class="win-button" onclick="playerTsumo()" hidden>ツモ</button>
   <button id="passRonButton" class="pass-button" onclick="passRon()" hidden>見逃す</button>
   <button id="discard" onclick="playerDiscard()">打牌</button>
  </div>
 </div>
</div>

<script>
"use strict";
const honors=["東","南","西","北","白","發","中"];
const dragons=["白","發","中"],winds=["東","南","西","北"];

let mode=4,gameLength=4,wall=[],deadWall=[],rinshanCount=0,kanCount=0;
let hands=[],rivers=[],melds=[],extracted=[],points=[],riichi=[],riichiTile=[],drawnTile=[],temporaryFuriten=[];
let dealer=0,roundNo=1,honba=0,riichiSticks=0,doraIndicator=null,kanDora=[],uraDora=[],current=0,selected=-1,busy=false,finished=false,matchFinished=false,pendingRon=null,callPending=null,riichiPending=false,gameToken=0,noticeTimer=null,nextTimer=null,lastTapIndex=-1,lastTapTime=0;

let firstTurn=Array(4).fill(true),ippatsu=Array(4).fill(false),rinshanTurn=Array(4).fill(false),chankanTile=null,turnCount=0;
const doubleTapDelay=350;

function activeSeats(){return mode===4?4:3}
function maxRounds(){return activeSeats()*(gameLength===4?1:2)}
function status(s){document.getElementById("status").textContent=s}
function toggleMenu(){let e=document.getElementById("menuPanel");e.hidden=!e.hidden}
function roundLabel(){let n=roundNo-1;return(n<activeSeats()?"東":"南")+["一","二","三","四"][n%activeSeats()]+"局"}
function seatWind(p){return winds[(p-dealer+activeSeats())%activeSeats()]}
function roundWind(){return roundNo<=activeSeats()?"東":"南"}
function key(t){return t.s==="z"?"z"+t.n:t.s+t.n}
function label(t){return t.s==="z"?t.n:t.n+({m:"萬",p:"筒",s:"索"}[t.s])}
function tileIndex(t){if(t.s==="m")return t.n-1;if(t.s==="p")return t.n+8;if(t.s==="s")return t.n+17;return 27+honors.indexOf(t.n)}
function sortTiles(a){const o={m:0,p:1,s:2,z:3};a.sort((x,y)=>o[x.s]-o[y.s]||(x.s==="z"?honors.indexOf(x.n)-honors.indexOf(y.n):x.n-y.n))}

function tileFaceHTML(t){
 if(t.s==="z"){
  let cls=dragons.includes(t.n)?"red":t.n==="白"?"white":t.n==="發"?"green":"blue";
  return '<div class="tile-face"><span class="tile-honor '+cls+'">'+t.n+'</span></div>'
 }
 if(t.s==="m")return '<div class="tile-face"><span class="tile-number" style="color:#c22">'+t.n+'</span><span class="tile-suit" style="color:#c22">萬</span></div>';
 if(t.s==="p"){
  let html='<div class="tile-face"><div class="tile-symbols">';
  for(let i=0;i<9;i++)html+=i<t.n?'<span class="circle-symbol '+(t.red&&i===2?"red-center":"")+'"></span>':'<span></span>';
  return html+'</div></div>'
 }
 if(t.s==="s"){
  let html='<div class="tile-face"><div class="tile-symbols">';
  for(let i=0;i<t.n;i++)html+='<span class="bamboo-symbol"></span>';
  return html+'</div></div>'
 }
 return label(t)
}

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]]
 }
 return a
}

function makeWall(){
 let a=[];
 for(let s of["m","p","s"]){
  let ns=mode===3&&s==="m"?[1,9]:[1,2,3,4,5,6,7,8,9];
  ns.forEach(n=>{for(let i=0;i<4;i++)a.push({s,n,red:n===5&&i===0})})
 }
 honors.forEach(n=>{for(let i=0;i<4;i++)a.push({s:"z",n})});
 shuffle(a);
 deadWall=a.splice(0,14);
 wall=a;
 rinshanCount=0;
 kanCount=0;
 doraIndicator=deadWall[4];
 uraDora=[deadWall[5],deadWall[7],deadWall[9],deadWall[11],deadWall[13]];
 kanDora=[];
 return wall;
}

function nextDora(t){
 if(t.s==="z"){
  let i=honors.indexOf(t.n);
  return{s:"z",n:i<4?winds[(i+1)%4]:dragons[(dragons.indexOf(t.n)+1)%3]}
 }
 if(mode===3&&t.s==="m")return{s:"m",n:t.n===1?9:1};
 return{s:t.s,n:t.n===9?1:t.n+1}
}

function isNorth(t){return t.s==="z"&&t.n==="北"}
function isSimple(t){return t.s!=="z"&&t.n>=2&&t.n<=8}
function isTerminal(t){return t.s!=="z"&&(t.n===1||t.n===9)}
function isYaochu(t){return t.s==="z"||isTerminal(t)}
function countKey(h,k){return h.filter(t=>key(t)===k).length}

function removeKey(h,k,n){
 for(let i=0;i<n;i++){
  let j=h.findIndex(t=>key(t)===k);
  if(j>=0)h.splice(j,1)
 }
}

function drawFor(p){
 if(!wall.length)return false;
 let t=wall.pop();
 hands[p].push(t);
 drawnTile[p]=t;
 return true;
}

function drawRinshan(p){
 if(rinshanCount>=4||!wall.length)return false;
 let t=deadWall[rinshanCount];
 deadWall[rinshanCount]=wall.pop();
 rinshanCount++;
 hands[p].push(t);
 drawnTile[p]=t;
 return true;
}

function drawnIndex(p){return drawnTile[p]?hands[p].indexOf(drawnTile[p]):-1}
function isClosed(p){return melds[p].every(m=>m.type==="ankan")}
function allTilesFor(hand,p){return hand.concat(...melds[p].map(m=>m.tiles))}
function groupList(pattern,p){return pattern.groups.concat(melds[p].map(m=>({type:m.type==="chi"?"chi":"pon",tile:m.tiles[0],open:m.type!=="ankan",kan:["ankan","minkan","kakan"].includes(m.type)})))}
function valuePair(pair,p){
 if(!pair||pair.s!=="z")return 0;
 let v=dragons.includes(pair.n)?2:0;
 if(pair.n===seatWind(p))v+=2;
 if(pair.n===roundWind())v+=2;
 return v;
}

function makeMelds(c,tiles,groups,need,out){
 let i=c.findIndex(v=>v>0);
 if(i<0){if(groups.length===need)out.push(groups.map(g=>({...g})));return}
 if(groups.length>=need)return;
 if(c[i]>=3){
  c[i]-=3;
  groups.push({type:"pon",tile:tiles[i]});
  makeMelds(c,tiles,groups,need,out);
  groups.pop();
  c[i]+=3
 }
 if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){
  c[i]--;c[i+1]--;c[i+2]--;
  groups.push({type:"chi",tile:tiles[i]});
  makeMelds(c,tiles,groups,need,out);
  groups.pop();
  c[i]++;c[i+1]++;c[i+2]++
 }
}

function getAgariPatterns(hand,openCount=0){
 if(hand.length!==14-openCount*3)return[];
 let c=Array(34).fill(0),tiles=Array(34);
 hand.forEach(t=>{let i=tileIndex(t);c[i]++;tiles[i]=t});
 let out=[],need=4-openCount;
 if(!openCount&&c.filter(x=>x===2).length===7&&c.every(x=>x===0||x===2))out.push({sevenPairs:true,pair:null,groups:[]});
 for(let i=0;i<34;i++)if(c[i]>=2){
  c[i]-=2;
  let a=[];
  makeMelds(c,tiles,[],need,a);
  a.forEach(groups=>out.push({sevenPairs:false,pair:tiles[i],groups}));
  c[i]+=2
 }
 return out;
}

function waitType(pattern,t){
 if(pattern.sevenPairs)return"tanki";
 if(!t)return"";
 if(pattern.pair&&key(pattern.pair)===key(t))return"tanki";
 for(let g of pattern.groups){
  if(g.type!=="chi"||g.tile.s!==t.s)continue;
  let n=g.tile.n;
  if(t.n===n+1)return"kanchan";
  if(n===1&&t.n===3)return"penchan";
  if(n===7&&t.n===7)return"penchan";
  if(t.n===n||t.n===n+2)return"ryanmen";
 }
 return"shanpon";
}

}

function isGreenTile(t){return new Set(["s2","s3","s4","s6","s8","z發"]).has(key(t))}

function yakumanCheck(all,pattern,groups,p,isTsumo){
 let y=[],cnt={};
 all.forEach(t=>cnt[key(t)]=(cnt[key(t)]||0)+1);
 const req=["m1","m9","p1","p9","s1","s9","z東","z南","z西","z北","z白","z發","z中"];
 if(!pattern.sevenPairs&&all.length===14&&req.every(k=>cnt[k]>=1)&&req.some(k=>cnt[k]===2))y.push("国士無双");
 if(all.every(t=>t.s==="z"))y.push("字一色");
 if(all.every(t=>t.s!=="z"&&(t.n===1||t.n===9)))y.push("清老頭");
 if(all.every(isGreenTile))y.push("緑一色");
 let trip=groups.filter(g=>g.type==="pon");
 if(["白","發","中"].every(n=>trip.some(g=>g.tile.s==="z"&&g.tile.n===n)))y.push("大三元");
 let wt=winds.filter(n=>trip.some(g=>g.tile.s==="z"&&g.tile.n===n)).length;
 if(wt===4)y.push("大四喜");
 else if(wt===3&&pattern.pair?.s==="z"&&winds.includes(pattern.pair.n))y.push("小四喜");
 let concealed=trip.filter(g=>!g.open).length;
 if(!isTsumo&&concealed===4&&winningTileIsTriplet(pattern,all))y.push("四暗刻単騎");
 else if(concealed===4)y.push("四暗刻");
 if(groups.filter(g=>g.kan).length===4)y.push("四槓子");
 if(isClosed(p)&&all.length===14&&!pattern.sevenPairs){
  let suits=new Set(all.map(t=>t.s));
  if(suits.size===1&&!suits.has("z")){
   let c=Array(10).fill(0);
   all.forEach(t=>c[t.n]++);
   if(c[1]>=3&&c[9]>=3&&[2,3,4,5,6,7,8].every(n=>c[n]>=1))y.push("九蓮宝燈")
  }
 }
 if(isTsumo&&firstTurn[p]){
  if(p===dealer&&roundNo===1)y.push("天和");
  else if(p!==dealer&&turnCount===0)y.push("地和")
 }
 return y;
}

function winningTileIsTriplet(pattern,all){return false}

function evaluatePattern(hand,pattern,p,isTsumo,winningTile){
 let all=allTilesFor(hand,p),groups=groupList(pattern,p),closed=isClosed(p),yaku=[];
 const add=(name,han)=>yaku.push({name,han});
 if(pattern.sevenPairs)add("七対子",2);
 if(closed&&riichi[p])add(riichi[p].double?"ダブルリーチ":"リーチ",riichi[p].double?2:1);
 if(closed&&isTsumo)add("門前ツモ",1);
 if(ippatsu[p]&&riichi[p])add("一発",1);
 if(all.every(isSimple))add("タンヤオ",1);

 groups.filter(g=>g.type==="pon"&&g.tile.s==="z").forEach(g=>{
  if(dragons.includes(g.tile.n))add("役牌 "+g.tile.n,1);
  if(g.tile.n===seatWind(p))add("自風牌",1);
  if(g.tile.n===roundWind())add("場風牌",1);
 });

 if(!pattern.sevenPairs){
  let seq=groups.filter(g=>g.type==="chi"),trip=groups.filter(g=>g.type==="pon"),pair=pattern.pair;
  if(closed&&seq.length===4&&valuePair(pair,p)===0&&waitType(pattern,winningTile)==="ryanmen")add("平和",1);
  if(closed){
   let c={};
   seq.forEach(g=>{let k=g.tile.s+g.tile.n;c[k]=(c[k]||0)+1});
   let pairs=Object.values(c).reduce((s,n)=>s+Math.floor(n/2),0);
   if(pairs>=2)add("二盃口",3);
   else if(pairs===1)add("一盃口",1)
  }
  if(trip.length===4)add("対々和",2);
  let concealed=trip.filter(g=>!g.open).length;
  if(!isTsumo&&winningTile){
   let rg=trip.find(g=>!g.open&&key(g.tile)===key(winningTile));
   if(rg)concealed--
  }
  if(concealed>=3)add("三暗刻",2);
  if(groups.filter(g=>g.kan).length>=3)add("三槓子",2);
  if(trip.length===4&&all.every(isYaochu)&&all.some(t=>t.s==="z"))add("混老頭",2);
  let chanta=groups.every(g=>g.type==="pon"?isYaochu(g.tile):(g.tile.n===1||g.tile.n===7))&&pair&&isYaochu(pair)&&all.some(t=>t.s==="z");
  if(seq.length&&chanta)add("混全帯么九",closed?2:1);
  let junchan=groups.every(g=>g.type==="pon"?isTerminal(g.tile):(g.tile.n===1||g.tile.n===7))&&pair&&isTerminal(pair)&&all.every(t=>t.s!=="z");
  if(seq.length&&junchan)add("純全帯么九",closed?3:2);
  let suits=new Set(all.filter(t=>t.s!=="z").map(t=>t.s)),hasHonor=all.some(t=>t.s==="z");
  if(suits.size===1&&hasHonor)add("混一色",closed?3:2);
  if(suits.size===1&&!hasHonor)add("清一色",closed?6:5);
  let seqBy={m:[],p:[],s:[]};
  seq.forEach(g=>seqBy[g.tile.s].push(g.tile.n));
  if([1,2,3,4,5,6,7].some(n=>seqBy.m.includes(n)&&seqBy.p.includes(n)&&seqBy.s.includes(n)))add("三色同順",closed?2:1);
  if(["m","p","s"].some(s=>[1,4,7].every(n=>seqBy[s].includes(n))))add("一気通貫",closed?2:1);
  let tn={};
  trip.filter(g=>g.tile.s!=="z").forEach(g=>(tn[g.tile.n]??=[]).push(g.tile.s));
  if(Object.values(tn).some(a=>new Set(a).size===3))add("三色同刻",2);
  let dt=trip.filter(g=>g.tile.s==="z"&&dragons.includes(g.tile.n));
  if(dt.length===2&&pair?.s==="z"&&dragons.includes(pair.n))add("小三元",2);
 }

 if(isTsumo&&rinshanTurn[p])add("嶺上開花",1);
 if(!isTsumo&&chankanTile)add("槍槓",1);
 if(isTsumo&&wall.length===0)add("海底摸月",1);
 if(!isTsumo&&wall.length===0)add("河底撈魚",1);

 let yakuman=yakumanCheck(all,pattern,groups,p,isTsumo);
 if(yakuman.length)return{yaku:yakuman.map(n=>({name:n,han:13})),han:13,fu:0,yakuman:true};

 if(!yaku.length)return null;
 let dora=countDora(all,allDoraIndicators(p));
 if(mode===3)dora+=extracted[p].length;
 if(dora)add("ドラ",dora);
 let han=yaku.reduce((s,y)=>s+y.han,0);
 return{yaku,han,fu:calculateFu(pattern,groups,p,isTsumo,winningTile,yaku),yakuman:false};
}

function calculateFu(pattern,groups,p,isTsumo,winningTile,yaku){
 if(pattern.sevenPairs)return 25;
 if(yaku.some(y=>y.name==="平和"))return isTsumo?20:30;
 let fu=20,closed=isClosed(p);
 if(!isTsumo&&closed)fu+=10;
 if(isTsumo)fu+=2;
 fu+=valuePair(pattern.pair,p);
 let wt=waitType(pattern,winningTile);
 if(["kanchan","penchan","tanki"].includes(wt))fu+=2;
 groups.forEach(g=>{
  if(g.type!=="pon")return;
  let ya=isYaochu(g.tile),v=g.kan?(ya?32:16):(ya?8:4);
  let ronCompleted=!isTsumo&&winningTile&&key(g.tile)===key(winningTile)&&!g.open&&!g.kan;
  if(g.open||ronCompleted)v/=2;
  fu+=v;
 });
 if(!isTsumo&&fu===20)return 30;
 return Math.ceil(fu/10)*10;
}

function basicPoints(han,fu){
 if(han>=13)return 8000;
 if(han>=11)return 6000;
 if(han>=8)return 4000;
 if(han>=6)return 3000;
 if(han>=5)return 2000;
 let b=fu*Math.pow(2,han+2);
 if((han===4&&fu>=40)||(han===3&&fu>=70))return 2000;
 return Math.min(b,2000);
}

function round100(n){return Math.ceil(n/100)*100}

function canAgari(hand,extra,p,isTsumo){
 let full=extra?[...hand,extra]:hand.slice(),patterns=getAgariPatterns(full,melds[p].length),best=null,bestScore=-1;
 for(let pattern of patterns){
  let r=evaluatePattern(full,pattern,p,isTsumo,extra||drawnTile[p]);
  if(!r)continue;
  let base=r.yakuman?8000:basicPoints(r.han,r.fu),score=base*(p===dealer?6:4);
  if(score>bestScore){bestScore=score;best={...r,pattern,hand:full}}
 }
 return best;
}

function calculateScore(result,type,winner,loser){
 let base=result.yakuman?8000:basicPoints(result.han,result.fu),transfers=[],total=0,dealerWin=winner===dealer;
 if(type==="ロン"){
  let pay=round100(base*(dealerWin?6:4))+honba*300;
  if(loser!=null){
   points[loser]-=pay;
   points[winner]+=pay;
   transfers.push({from:loser,to:winner,amount:pay});
   total=pay
  }
 }else{
  for(let p=0;p<activeSeats();p++)if(p!==winner){
   let mult=dealerWin?2:(p===dealer?2:1),pay=round100(base*mult)+honba*100;
   points[p]-=pay;
   points[winner]+=pay;
   transfers.push({from:p,to:winner,amount:pay});
   total+=pay
  }
 }
 return{han:result.han,fu:result.fu,total,transfers};
}

function calculateShanten(hand,openCount=0){
 let c=Array(34).fill(0);
 hand.forEach(t=>c[tileIndex(t)]++);
 let best=8,need=4-openCount,seen=new Set();
 function dfs(m,t,p){
  m=Math.min(m,need);
  t=Math.min(t,need-m);
  let i=c.findIndex(x=>x>0);
  if(i<0){best=Math.min(best,2*need-2*m-t-p);return}
  let state=c.join("")+":"+m+":"+t+":"+p;
  if(seen.has(state))return;
  seen.add(state);
  c[i]--;dfs(m,t,p);c[i]++;
  if(c[i]>=3&&m<need){
   c[i]-=3;dfs(m+1,t,p);c[i]+=3
  }
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){
   c[i]--;c[i+1]--;c[i+2]--;
   dfs(m+1,t,p);
   c[i]++;c[i+1]++;c[i+2]++
  }
  if(c[i]>=2){
   c[i]-=2;
   if(!p)dfs(m,t,1);else dfs(m,t+1,p);
   c[i]+=2
  }
  if(i<27&&i%9<=7&&c[i+1]){
   c[i]--;c[i+1]--;
   dfs(m,t+1,p);
   c[i]++;c[i+1]++
  }
  if(i<27&&i%9<=6&&c[i+2]){
   c[i]--;c[i+2]--;
   dfs(m,t+1,p);
   c[i]++;c[i+2]++
  }
 }
 dfs(0,0,0);
 return best;
}

}

function playerDiscard(){
 if(finished||busy||current!==0||pendingRon||callPending||selected<0||hands[0].length!==14-melds[0].length*3)return;
 if(riichi[0]&&selected!==drawnIndex(0))return;

 let declaring=riichiPending;
 if(declaring){
  if(!canRiichiAfterDiscard(hands[0],selected,0))return;
  points[0]-=1000;
  riichiSticks++;
  riichi[0]={double:turnCount===0,ippatsu:true};
  ippatsu[0]=true;
  riichiPending=false
 }

 let t=hands[0].splice(selected,1)[0];
 drawnTile[0]=null;
 rivers[0].push(t);
 if(declaring)riichiTile[0]=t;
 firstTurn[0]=false;
 turnCount++;
 selected=-1;
 busy=true;
 status("CPUが対局中...");
 update();
 let token=gameToken;

 if(declaring){
  showNotice("リーチ！","あなたがリーチを宣言しました");
  afterNotice(()=>afterDiscard(0,t,token),token)
 }else afterDiscard(0,t,token);
}

function playerRiichi(){
 if(selected<0||!canRiichiAfterDiscard(hands[0],selected,0))return;
 riichiPending=true;
 status("リーチを宣言します。選択した牌を捨ててください。");
 update();
}

function playerNorth(){
 if(mode!==3||finished||busy||riichi[0]||current!==0)return;
 let i=hands[0].findIndex(isNorth);
 if(i<0)return;
 hands[0].splice(i,1);
 extracted[0].push({s:"z",n:"北"});
 selected=-1;
 ippatsu[0]=false;
 if(!drawFor(0)){endGame("補充牌がありません。流局です。");return}
 sortTiles(hands[0]);
 status("北抜きの補充牌を引きました。");
 update();
}

function playerAnkan(){
 if(finished||busy||current!==0||riichi[0])return;
 let t=hands[0].find(x=>countKey(hands[0],key(x))===4);
 if(!t)return;
 removeKey(hands[0],key(t),4);
 melds[0].push({type:"ankan",tiles:[t,t,t,t],from:0});
 drawnTile[0]=null;
 selected=-1;
 ippatsu[0]=false;
 if(!addKanDora()||!drawRinshan(0)){endGame("嶺上牌がありません。流局です。");return}
 rinshanTurn[0]=true;
 sortTiles(hands[0]);
 status("暗槓しました。嶺上牌を引きました。");
 update();
}

function chooseDiscard(h,p){
 if(riichi[p])return Math.max(0,drawnIndex(p));
 let best=0,bestScore=Infinity;
 for(let i=0;i<h.length;i++){
  let test=h.slice(),t=test.splice(i,1)[0],sh=calculateShanten(test,melds[p].length),same=countKey(test,key(t)),value=same*7;
  if(t.s==="z")value+=same?3:-2;
  else for(let q of test)if(q.s===t.s){
   let d=Math.abs(q.n-t.n);
   if(d===1)value+=2;
   if(d===2)value++
  }
  let score=sh*100-value+Math.random()*.1;
  if(score<bestScore){bestScore=score;best=i}
 }
 return best;
}

function cpuNorth(p){
 if(mode!==3||riichi[p])return false;
 let i=hands[p].findIndex(isNorth);
 if(i<0)return false;
 hands[p].splice(i,1);
 extracted[p].push({s:"z",n:"北"});
 return drawFor(p);
}

function cpuTurn(token,skipDraw=false){
 if(token!==gameToken||finished||pendingRon||callPending)return;
 let p=current;
 if(!skipDraw&&!drawFor(p)){endGame("山牌がなくなりました。流局です。");return}
 sortTiles(hands[p]);

 if(mode===3&&!riichi[p]){
  let guard=0;
  while(hands[p].some(isNorth)&&guard++<4){
   if(!cpuNorth(p)){endGame("補充牌がありません。流局です。");return}
  }
 }

 rinshanTurn[p]=false;
 let ts=canAgari(hands[p],null,p,true);
 if(ts){winGame(p,"ツモ",ts);return}

 let i=chooseDiscard(hands[p],p),t=hands[p].splice(i,1)[0];
 drawnTile[p]=null;
 rivers[p].push(t);
 let cpuRi=false;

 if(!riichi[p]&&isClosed(p)&&points[p]>=1000&&isTenpai(hands[p],p)){
  riichi[p]={double:false,ippatsu:true};
  ippatsu[p]=true;
  points[p]-=1000;
  riichiSticks++;
  riichiTile[p]=t;
  cpuRi=true
 }

 firstTurn[p]=false;
 update();

 if(cpuRi){
  showNotice("リーチ！","CPU "+p+" がリーチしました");
  afterNotice(()=>afterDiscard(p,t,token),token)
 }else afterDiscard(p,t,token);
}

function getCallOptions(p,t,discarder){
 if(riichi[p])return[];
 let o=[];
 if(countKey(hands[p],key(t))>=2)o.push("pon");
 if(countKey(hands[p],key(t))>=3&&wall.length>0&&kanCount<4)o.push("kan");

 if(mode===4&&p===(discarder+1)%activeSeats()&&t.s!=="z"){
  for(let st=t.n-2;st<=t.n;st++){
   if(st<1||st>7)continue;
   let ns=[st,st+1,st+2].filter(n=>n!==t.n);
   if(ns.every(n=>hands[p].some(q=>q.s===t.s&&q.n===n))){
    o.push("chi");
    break
   }
  }
 }
 return o;
}

function afterDiscard(discarder,t,token){
 if(token!==gameToken||finished)return;

 for(let step=1;step<activeSeats();step++){
  let p=(discarder+step)%activeSeats();
  if(p===0&&temporaryFuriten[0])continue;
  let r=canAgari(hands[p],t,p,false);
  if(!r)continue;
  if(p===0){
   pendingRon={player:0,discarder,tile:t,result:r,token};
   busy=false;
   status("ロンできます！");
   update();
   return
  }
  winGame(p,"ロン",r,discarder);
  return
 }

 let candidates=[];
 for(let step=1;step<activeSeats();step++){
  let p=(discarder+step)%activeSeats(),opts=getCallOptions(p,t,discarder);
  if(opts.length)candidates.push({p,opts,step})
 }
 candidates.sort((a,b)=>((a.opts.includes("pon")||a.opts.includes("kan"))?0:1)-((b.opts.includes("pon")||b.opts.includes("kan"))?0:1)||a.step-b.step);

 if(!candidates.length){advanceTurn(discarder,token);return}

 let c=candidates[0];
 if(c.p===0){
  callPending={player:0,discarder,tile:t,options:c.opts,token};
  busy=false;
  status("鳴くことができます。");
  update();
  return
 }
 executeCall(c.p,c.opts.includes("kan")?"kan":c.opts.includes("pon")?"pon":"chi",discarder,t,token);
}

function playerCall(type){
 if(!callPending||callPending.player!==0||!callPending.options.includes(type))return;
 let c=callPending;
 callPending=null;
 executeCall(0,type,c.discarder,c.tile,c.token);
}

function skipCall(){
 if(!callPending)return;
 let c=callPending;
 callPending=null;
 busy=true;
 advanceTurn(c.discarder,c.token);
}

function executeCall(p,type,discarder,t,token){
 if(token!==gameToken||finished)return;
 let tiles=[t];

 if(type==="pon"){
  removeKey(hands[p],key(t),2);
  tiles.push(t,t)
 }
 if(type==="kan"){
  removeKey(hands[p],key(t),3);
  tiles.push(t,t,t)
 }
 if(type==="chi"){
  let chosen=null;
  for(let st=t.n-2;st<=t.n;st++){
   if(st<1||st>7)continue;
   let ns=[st,st+1,st+2].filter(n=>n!==t.n),found=ns.map(n=>hands[p].find(q=>q.s===t.s&&q.n===n));
   if(found.every(Boolean)){chosen=found;break}
  }
  if(!chosen){advanceTurn(discarder,token);return}
  chosen.forEach(q=>{
   hands[p].splice(hands[p].indexOf(q),1);
   tiles.push(q)
  })
 }

 melds[p].push({type:type==="kan"?"minkan":type,tiles,from:discarder});
 drawnTile[p]=null;
 current=p;
 selected=-1;
 ippatsu.fill(false);

 if(type==="kan"){
  if(!addKanDora()||!drawRinshan(p)){endGame("嶺上牌がありません。");return}
  rinshanTurn[p]=true
 }

 sortTiles(hands[p]);
 update();

 if(p===0){
  busy=false;
  status("鳴きました。牌を捨ててください。");
  return
 }

 busy=true;
 setTimeout(()=>cpuDiscardAfterCall(p,token),500);
}

function cpuDiscardAfterCall(p,token){
 if(token!==gameToken||finished)return;
 let i=chooseDiscard(hands[p],p),t=hands[p].splice(i,1)[0];
 drawnTile[p]=null;
 rivers[p].push(t);
 update();
 afterDiscard(p,t,token);
}

function advanceTurn(discarder,token){
 if(token!==gameToken||finished)return;
 temporaryFuriten[0]=false;
 current=(discarder+1)%activeSeats();
 if(current===0)setTimeout(()=>{if(token===gameToken)startPlayerTurn()},350);
 else{
  busy=true;
  setTimeout(()=>{if(token===gameToken)cpuTurn(token)},450)
 }
}

function startPlayerTurn(){
 if(finished)return;
 current=0;
 if(!drawFor(0)){endGame("山牌がなくなりました。流局です。");return}
 sortTiles(hands[0]);
 selected=-1;
 lastTapIndex=-1;
 lastTapTime=0;
 rinshanTurn[0]=false;
 let ts=canAgari(hands[0],null,0,true);

 if(riichi[0]&&!ts){
  busy=true;
  status("リーチ中：自動ツモ切りします。");
  update();
  let token=gameToken;
  setTimeout(()=>{
   if(token!==gameToken||finished)return;
   let i=drawnIndex(0);
   if(i<0)return;
   let t=hands[0].splice(i,1)[0];
   drawnTile[0]=null;
   rivers[0].push(t);
   busy=true;
   update();
   afterDiscard(0,t,token)
  },450);
  return
 }

 busy=false;
 status(ts?"ツモできます！":"");
 update();
}

function playerRon(){
 if(!pendingRon||pendingRon.player!==0)return;
 let r=pendingRon.result,l=pendingRon.discarder;
 pendingRon=null;
 winGame(0,"ロン",r,l);
}

function passRon(){
 if(!pendingRon)return;
 let c=pendingRon;
 pendingRon=null;
 temporaryFuriten[0]=true;
 busy=true;
 status("ロンを見逃しました。");
 advanceTurn(c.discarder,c.token);
 update();
}

function playerTsumo(){
 if(finished||busy||current!==0)return;
 let r=canAgari(hands[0],null,0,true);
 if(r)winGame(0,"ツモ",r);
}

function playerName(p){return p===0?"あなた":"CPU "+p}

function showResult(winner,type,result,score){
 document.getElementById("resultTitle").textContent=playerName(winner)+"の"+type+"！";
 let names=result.yaku.map(y=>y.name+" "+y.han+"翻").join("・");
 let html='<div class="result-main">'+score.han+'翻 '+score.fu+'符</div><div class="result-detail">'+names+'<br><strong>獲得点数：'+score.total.toLocaleString()+'点</strong></div><div class="result-line"><strong>点数移動</strong></div>';

 score.transfers.forEach(t=>{
  html+='<div class="result-line"><span>'+playerName(t.from)+' → '+playerName(t.to)+'</span><strong>+'+t.amount.toLocaleString()+'点</strong></div>'
 });

 if(riichiSticks){
  let b=riichiSticks*1000;
  points[winner]+=b;
  html+='<div class="result-line"><span>リーチ供託</span><strong>+'+b.toLocaleString()+'点</strong></div>';
  score.total+=b;
  riichiSticks=0
 }

 html+='<div class="result-line"><strong>対局終了後の持ち点</strong></div>';
 for(let p=0;p<activeSeats();p++){
  html+='<div class="result-line"><span>'+playerName(p)+'</span><strong>'+points[p].toLocaleString()+'点</strong></div>'
 }

 document.getElementById("resultBody").innerHTML=html;
 document.getElementById("resultPanel").hidden=false;
}

function advanceRound(winner){
 if(winner===dealer)honba++;
 else{
  dealer=(dealer+1)%activeSeats();
  roundNo++;
  honba=0
 }
 if(roundNo>maxRounds())matchFinished=true;
}

function winGame(winner,type,result,loser){
 if(finished)return;
 finished=true;
 busy=false;
 pendingRon=null;
 callPending=null;
 riichiPending=false;
 let score=calculateScore(result,type,winner,loser);
 advanceRound(winner);
 status(playerName(winner)+"の"+type+"！");
 update();
 showResult(winner,type,result,score);
 document.querySelector(".result-close").textContent=matchFinished?"モード選択":"次の局へ";
 clearTimeout(nextTimer);
}

function endGame(message){
 if(finished)return;
 finished=true;
 busy=false;
 pendingRon=null;
 callPending=null;

 let tenpai=[];
 for(let p=0;p<activeSeats();p++)if(isTenpai(hands[p],p))tenpai.push(p);
 let noten=activeSeats()-tenpai.length;

 if(tenpai.length&&noten){
  let pool=3000,gain=pool/tenpai.length,loss=pool/noten;
  tenpai.forEach(p=>points[p]+=gain);
  for(let p=0;p<activeSeats();p++)if(!tenpai.includes(p))points[p]-=loss
 }

 if((dealer===0&&tenpai.includes(0))||(dealer!==0&&!tenpai.includes(dealer)))honba++;
 else{
  dealer=(dealer+1)%activeSeats();
  roundNo++;
  honba=0
 }

 if(roundNo>maxRounds())matchFinished=true;
 status(message);
 update();

 document.getElementById("resultTitle").textContent="流局";
 let html='<div class="result-detail">'+message+'<br>テンパイ：'+(tenpai.length?tenpai.map(playerName).join("・"):"なし")+'</div>';

 for(let p=0;p<activeSeats();p++){
  html+='<div class="result-line"><span>'+playerName(p)+'</span><strong>'+points[p].toLocaleString()+'点</strong></div>'
 }

 document.getElementById("resultBody").innerHTML=html;
 document.getElementById("resultPanel").hidden=false;
 document.querySelector(".result-close").textContent=matchFinished?"モード選択":"次の局へ";
 clearTimeout(nextTimer);
}

document.getElementById("doraIndicator").textContent="?";
</script>
</body>
