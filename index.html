
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#123c30">
<title>MAHJONG QUEST</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#102b24;
 color:white;
 font-family:Arial,"Noto Sans JP",sans-serif;
 user-select:none;
}
button{font:inherit;cursor:pointer}
header{
 background:#10251f;
 padding:12px;
 text-align:center;
 border-bottom:1px solid #49685b;
}
header h1{font-size:21px;margin:0;color:#e5c77a}
header small{color:#a9c0b4}
.menu{
 display:flex;justify-content:center;gap:8px;
 padding:10px;
 background:#193a30;
}
.menu button{
 border:1px solid #80998b;
 border-radius:8px;
 padding:9px 15px;
 background:#294e40;color:white;
}
.menu button.active{background:#d2ae58;color:#172b22}
.status{
 text-align:center;padding:10px;
 color:#f1d98c;font-weight:bold;
}
.table{
 margin:8px auto;
 width:96%;
 max-width:480px;
 height:490px;
 border:9px solid #704b2e;
 border-radius:24px;
 background:radial-gradient(ellipse,#26815b,#125039);
 position:relative;
 box-shadow:0 5px 18px #0008;
}
.player{
 position:absolute;
 display:flex;
 align-items:center;
 flex-direction:column;
 font-size:12px;
 gap:4px;
}
.player .name{color:#f5e3a8;font-weight:bold}
.opponent-top{top:8px;left:50%;transform:translateX(-50%)}
.opponent-left{left:5px;top:42%;transform:translateY(-50%)}
.opponent-right{right:5px;top:42%;transform:translateY(-50%)}
.center{
 position:absolute;top:40%;left:50%;
 transform:translate(-50%,-50%);
 text-align:center;width:65%;
}
.center .round{font-size:15px;color:#f6e5ad}
.center .info{font-size:12px;margin-top:8px}
.discards{
 display:flex;flex-wrap:wrap;justify-content:center;
 max-width:130px;gap:2px;margin-top:4px;
}
.discards .tile{width:19px;height:27px;font-size:13px}
.hand-area{
 position:fixed;bottom:0;left:0;right:0;
 background:#172d26;
 padding:10px 4px calc(12px + env(safe-area-inset-bottom));
 border-top:2px solid #8b7047;
 z-index:5;
}
.hand-title{
 display:flex;justify-content:space-between;
 padding:0 7px 8px;font-size:12px;color:#e6d5a6;
}
.hand{
 display:flex;justify-content:center;gap:2px;
 width:100%;overflow-x:auto;padding:3px 0 8px;
}
.tile{
 flex:0 0 auto;
 width:clamp(21px,6.1vw,31px);
 height:clamp(39px,11vw,51px);
 background:#f5f0dc;
 color:#222;
 border:1px solid #b8ad91;
 border-radius:4px;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(14px,4vw,21px);
 font-weight:bold;
 box-shadow:0 2px 2px #0006;
}
.tile.red{color:#c52b27}
.tile.green{color:#168348}
.tile.blue{color:#2566b4}
.tile.selected{
 transform:translateY(-9px);
 border:2px solid #e9b94e;
}
.actions{
 display:flex;justify-content:center;
 flex-wrap:wrap;gap:7px;
}
.actions button{
 padding:9px 15px;border:0;border-radius:7px;
 background:#d1ae5e;color:#1c2c23;font-weight:bold;
}
.actions button:disabled{opacity:.35}
.sub-actions{
 display:flex;justify-content:center;gap:8px;
 margin-top:7px;
}
.sub-actions button{
 background:#345d4b;color:white;
 border:1px solid #8ca696;border-radius:7px;
 padding:7px 12px;font-size:12px;
}
.log{
 margin:10px auto 210px;
 width:94%;max-width:460px;
 height:65px;overflow:auto;
 background:#172d26;border-radius:8px;
 padding:8px;font-size:12px;color:#c6d6c9;
}
@media(max-height:700px){
 .table{height:400px}
 .hand-area{padding-top:6px}
}
</style>
</head>

<body>

<header>
<h1>🀄 MAHJONG QUEST</h1>
<small>REALISTIC JAPANESE MAHJONG</small>
</header>

<div class="menu">
<button id="four" class="active" onclick="setMode(4)">四人麻雀</button>
<button id="three" onclick="setMode(3)">三人麻雀</button>
</div>

<div class="status" id="status">ゲーム準備中</div>

<div class="table">
 <div class="player opponent-top">
  <div class="name">CPU 2</div>
  <div id="river2" class="discards"></div>
 </div>
 <div class="player opponent-left">
  <div class="name">CPU 3</div>
  <div id="river3" class="discards"></div>
 </div>
 <div class="player opponent-right">
  <div class="name">CPU 1</div>
  <div id="river1" class="discards"></div>
 </div>

 <div class="center">
  <div class="round" id="round">東一局</div>
  <div style="font-size:27px;margin:8px">🀄</div>
  <div id="wallinfo">残り牌：0</div>
  <div class="info" id="score">あなた 25000点</div>
 </div>
</div>

<div class="log" id="log">ゲームを開始してください。</div>

<div class="hand-area">
 <div class="hand-title">
  <span>あなたの手牌</span>
  <span id="count">0枚</span>
 </div>
 <div class="hand" id="hand"></div>
 <div class="actions">
  <button id="discard" onclick="discardTile()">打牌</button>
  <button id="draw" onclick="drawTile()" disabled>ツモ</button>
 </div>
 <div class="sub-actions">
  <button onclick="newGame()">新しい局</button>
  <button onclick="sortHand()">牌を整理</button>
 </div>
</div>

<script>
const suits=["m","p","s"];
const honors=["東","南","西","北","白","發","中"];

let mode=4;
let wall=[];
let hand=[];
let rivers=[[],[],[]];
let selected=-1;
let turn=true;
let finished=false;
let roundNumber=1;
let points=25000;

function makeTiles(){
 let tiles=[];
 for(let s of suits){
  if(mode===3 && s==="m"){
   for(let n of [1,9]){
    for(let i=0;i<4;i++)tiles.push({s,n});
   }
  }else{
   for(let n=1;n<=9;n++){
    for(let i=0;i<4;i++)tiles.push({s,n});
   }
  }
 }
 for(let h of honors){
  for(let i=0;i<4;i++)tiles.push({s:"z",n:h});
 }
 return tiles;
}

function key(t){
 return t.s==="z"?t.n:t.s+t.n;
}

function label(t){
 if(t.s==="z")return t.n;
 return t.n+({m:"萬",p:"筒",s:"索"}[t.s]);
}

function color(t){
 if(t.s==="z")return "blue";
 if(t.s==="m")return "red";
 if(t.s==="s")return "green";
 return "";
}

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function setMode(n){
 mode=n;
 document.getElementById("four").classList.toggle("active",n===4);
 document.getElementById("three").classList.toggle("active",n===3);
 newGame();
}

function newGame(){
 wall=shuffle(makeTiles());
 hand=[];
 rivers=[[],[],[]];
 selected=-1;
 turn=true;
 finished=false;
 for(let i=0;i<13;i++)hand.push(wall.pop());
 sortHand(false);
 document.getElementById("log").innerHTML="";
 log("新しい局を開始しました。");
 render();
 updateStatus("あなたの番です。ツモしてください。");
 document.getElementById("draw").disabled=false;
}

function sortHand(draw=true){
 hand.sort((a,b)=>{
  const order={m:0,p:1,s:2,z:3};
  if(order[a.s]!==order[b.s])return order[a.s]-order[b.s];
  if(a.s==="z")return String(a.n).localeCompare(String(b.n),"ja");
  return a.n-b.n;
 });
 if(draw)render();
}

function render(){
 const el=document.getElementById("hand");
 el.innerHTML="";
 hand.forEach((t,i)=>{
  let d=document.createElement("div");
  d.className="tile "+color(t)+(selected===i?" selected":"");
  d.textContent=label(t);
  d.onclick=()=>{
   if(!turn||finished)return;
   selected=i;
   render();
  };
  el.appendChild(d);
 });
 document.getElementById("count").textContent=hand.length+"枚";
 document.getElementById("wallinfo").textContent="残り牌："+wall.length;
 document.getElementById("score").textContent="あなた "+points+"点";
 for(let i=0;i<3;i++){
  let r=document.getElementById("river"+(i+1));
  r.innerHTML="";
  rivers[i].forEach(t=>{
   let d=document.createElement("div");
   d.className="tile "+color(t);
   d.textContent=label(t);
   r.appendChild(d);
  });
 }
}

function drawTile(){
 if(!turn||finished||hand.length!==13)return;
 if(wall.length===0){
  endGame("流局です。");
  return;
 }
 hand.push(wall.pop());
 turn=true;
 selected=-1;
 sortHand(false);
 render();
 updateStatus("ツモしました。牌を選んで打牌してください。");
 document.getElementById("draw").disabled=true;
 log("あなたがツモしました。");
}

function discardTile(){
 if(!turn||finished)return;
 if(hand.length!==14){
  updateStatus("先にツモしてください。");
  return;
 }
 if(selected<0){
  updateStatus("捨てる牌を選択してください。");
  return;
 }
 let t=hand.splice(selected,1)[0];
 rivers[0].push(t);
 selected=-1;
 turn=false;
 render();
 log("あなた："+label(t)+"を打牌");
 document.getElementById("discard").disabled=true;
 document.getElementById("draw").disabled=true;
 setTimeout(cpuTurn,500);
}

function cpuTurn(){
 if(finished)return;
 const cpuCount=mode===4?3:2;
 for(let c=0;c<cpuCount;c++){
  if(wall.length===0){
   endGame("流局です。");
   return;
  }
  let t=wall.pop();
  rivers[c+1].push(t);
  log("CPU "+(c+1)+" が打牌しました。");
 }
 render();
 if(wall.length===0){
  endGame("流局です。");
  return;
 }
 turn=true;
 updateStatus("あなたの番です。ツモしてください。");
 document.getElementById("draw").disabled=false;
 document.getElementById("discard").disabled=false;
}

function updateStatus(s){
 document.getElementById("status").textContent=s;
}

function log(s){
 const el=document.getElementById("log");
 el.innerHTML+=s+"<br>";
 el.scrollTop=el.scrollHeight;
}

function endGame(s){
 finished=true;
 turn=false;
 updateStatus(s);
 document.getElementById("draw").disabled=true;
 document.getElementById("discard").disabled=true;
 log(s);
}

newGame();
</script>

</body>
</html>
