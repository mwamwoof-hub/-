<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123c30">
<title>麻雀</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102b24;color:white;font-family:Arial,"Noto Sans JP",sans-serif;user-select:none}
button{cursor:pointer;font:inherit}
[hidden]{display:none!important}
.start-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:25px;background:radial-gradient(ellipse,#26815b,#102b24)}
.start-title{font-size:24px;color:#f1d98c;font-weight:bold}
.start-subtitle{font-size:13px;color:#c6d6c9}
.mode-select{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.mode-select button{padding:17px;border:2px solid #d2ae58;border-radius:12px;background:#294e40;color:white;font-size:18px;font-weight:bold}
.status{text-align:center;padding:9px;color:#f1d98c;font-weight:bold;min-height:36px}
.table{position:relative;width:96%;max-width:480px;height:490px;margin:5px auto;background:radial-gradient(ellipse,#26815b,#125039);border:9px solid #704b2e;border-radius:24px;box-shadow:0 5px 18px #0008;overflow:hidden}
.player{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.name{color:#f5e3a8;font-weight:bold;white-space:nowrap}
.top{top:43px;left:50%;transform:translateX(-50%)}
.left{left:5px;top:38%;width:30%}
.right{right:5px;top:38%;width:30%}
.bottom{bottom:7px;left:50%;transform:translateX(-50%);width:95%}
.top .name{transform:rotate(180deg)}
.left .name{transform:rotate(90deg)}
.right .name{transform:rotate(-90deg)}
.backhand{display:flex;justify-content:center;gap:3px;align-items:center;min-height:19px;flex-wrap:nowrap}
.back{width:16px;height:9px;border:1px solid #d4c08b;background:#286c50;border-radius:2px;flex:0 0 16px}
.top .backhand{transform:rotate(180deg)}
.left .backhand{transform:rotate(90deg);margin:9px 0}
.right .backhand{transform:rotate(-90deg);margin:9px 0}
.river{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:2px;width:100%;max-width:140px;min-height:20px}
.left .river,.right .river{max-width:110px}
.tile{flex:0 0 auto;width:clamp(21px,6.1vw,31px);height:clamp(38px,10vw,49px);background:#f5f0dc;color:#222;border:1px solid #b8ad91;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.8vw,20px);font-weight:bold;box-shadow:0 2px 2px #0006}
.smalltile{width:17px;height:24px;font-size:11px}
.red{color:#c52b27}
.green{color:#168348}
.blue{color:#2566b4}
.selected{transform:translateY(-8px);border:2px solid #e9b94e}
.riichi-discard{transform:rotate(90deg);margin:5px 3px}
.center{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);text-align:center;width:35%;pointer-events:none;z-index:1}
.round{color:#f6e5ad;font-size:16px}
.centerinfo{font-size:11px;margin-top:7px}
.dora-area{position:absolute;top:7px;left:7px;display:flex;align-items:center;justify-content:flex-start;gap:4px;z-index:2;white-space:nowrap}
.dora-label{font-size:10px;color:#f3dfa1;font-weight:bold}
.dora-tile{width:25px;height:35px;background:#f5f0dc;color:#2566b4;border:1px solid #b8ad91;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold}
.dora-arrow{font-size:14px;color:#f3dfa1;font-weight:bold}
.dora-result{display:flex;flex-direction:column;align-items:center;gap:1px}
.dora-result-label{font-size:9px;color:#ffe18b;font-weight:bold}
.actual-dora{border:2px solid #f1c95c;box-shadow:0 0 5px #f1c95c}
.north-area,.meld-area{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;min-height:20px;margin:3px 0}
.north-tile{background:#f5f0dc;color:#2566b4;border-radius:3px;padding:3px 5px;font-weight:bold;font-size:12px}
.meld-area{align-items:center}
.meld-group{display:flex;gap:1px;padding:2px;border:1px solid #d5bd7b;border-radius:4px;background:#173b2e}
.meld-tile{width:19px;height:27px;background:#f5f0dc;color:#222;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
#meld0{position:absolute;right:0;bottom:0;justify-content:flex-end;max-width:55%;z-index:3}
.center-score{position:absolute;width:105px;min-height:25px;display:flex;justify-content:center;align-items:center;padding:4px 7px;border:1px solid #d9c17c;border-radius:6px;background:#173b2e;color:#fff2c1;font-size:12px;font-weight:bold;white-space:nowrap;z-index:2;box-shadow:0 2px 5px #0006}
.score3{top:28%;left:19%;transform:rotate(45deg)}
.score1{top:28%;right:19%;transform:rotate(-45deg)}
.score0{bottom:28%;left:19%;transform:rotate(-45deg)}
.score2{bottom:28%;right:19%;transform:rotate(45deg)}
.handarea{position:fixed;bottom:0;left:0;right:0;background:#172d26;padding:9px 3px calc(10px + env(safe-area-inset-bottom));border-top:2px solid #8b7047;z-index:5}
.handtitle{display:flex;justify-content:space-between;padding:0 7px 7px;font-size:12px;color:#e6d5a6}
.hand{display:flex;justify-content:center;gap:2px;overflow-x:auto;padding:4px 0 9px}
.hand .drawn-tile{margin-left:13px}
.actions,.call-actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.actions button,.call-actions button{padding:9px 13px;border:0;border-radius:7px;background:#d1ae5e;color:#1c2c23;font-weight:bold}
.actions button:disabled{opacity:.35}
.actions .north-button{background:#397eaf;color:white}
.actions .riichi-button{background:#a83b3b;color:white}
.actions .win-button{background:#e4c66d}
.actions .pass-button,.call-actions .skip-call{background:#52645a;color:white}
.call-actions{margin-bottom:7px}
.call-actions button{padding:10px 15px}
.top-menu{position:fixed;top:8px;right:10px;z-index:50}
.top-menu-button{padding:9px 14px;border:1px solid #d2ae58;border-radius:8px;background:#294e40;color:white;font-weight:bold}
.menu-panel{position:absolute;top:43px;right:0;width:160px;padding:8px;background:#173b2e;border:1px solid #d2ae58;border-radius:10px;box-shadow:0 5px 15px #0009}
.menu-panel button{display:block;width:100%;margin:4px 0;padding:10px;border:0;border-radius:6px;background:#345d4b;color:white;font-size:13px}
.riichi-notice{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);width:85%;max-width:340px;padding:22px 16px;border:3px solid #f1d06b;border-radius:16px;background:linear-gradient(135deg,#8d2525,#501616);color:white;text-align:center;font-size:25px;font-weight:bold;z-index:100;pointer-events:none}
.notice-sub{display:block;margin-top:8px;font-size:13px;color:#ffe9a8}
.result-panel{position:fixed;z-index:110;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:390px;max-height:75vh;overflow-y:auto;padding:20px;border:2px solid #e6c66d;border-radius:16px;background:linear-gradient(145deg,#244d3c,#142c23);box-shadow:0 8px 35px #000c}
.result-title{text-align:center;font-size:24px;font-weight:bold;color:#f5d77d;margin-bottom:12px}
.result-main{text-align:center;font-size:17px;font-weight:bold;margin-bottom:8px}
.result-detail{text-align:center;color:#f5e4b4;font-size:14px;line-height:1.8;margin-bottom:12px}
.result-line{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.result-close{display:block;width:100%;margin-top:15px;padding:11px;border:0;border-radius:8px;background:#d1ae5e;color:#1c2c23;font-weight:bold}
@media(max-height:700px){.table{height:400px}.center{top:47%}.score3,.score1{top:29%}.score0,.score2{bottom:29%}}
@media(max-width:380px){.left,.right{width:29%}.center{width:34%}.actions button{padding:8px 9px}.hand .drawn-tile{margin-left:8px}.dora-tile{width:22px;height:32px;font-size:13px}.dora-label{font-size:9px}.dora-area{gap:3px}.center-score{width:88px;font-size:10px;padding:3px}.score3,.score0{left:15%}.score1,.score2{right:15%}.back{width:14px;height:8px;flex-basis:14px}.backhand{gap:2px}}
</style>
</head>
<body>
<div class="start-screen" id="startScreen">
 <div class="start-title">対局モードを選択</div>
 <div class="start-subtitle">プレイする麻雀の種類を選んでください</div>
 <div class="mode-select" id="playerModeOptions">
  <button onclick="setMode(4)">四人麻雀</button>
  <button onclick="setMode(3)">三人麻雀</button>
 </div>
 <div id="lengthOptions" hidden>
  <div class="start-subtitle">対局形式を選択</div>
  <div class="mode-select">
   <button onclick="setLength(4)">東風戦</button>
   <button onclick="setLength(8)">半荘戦</button>
  </div>
 </div>
</div>
<div class="riichi-notice" id="riichiNotice" hidden>リーチ！<span class="notice-sub" id="riichiNoticeSub"></span></div>
<div class="result-panel" id="resultPanel" hidden>
 <div class="result-title" id="resultTitle">和了！</div>
 <div id="resultBody"></div>
 <button class="result-close" onclick="closeResult()">次の局へ</button>
</div>
<div id="gameScreen" hidden>
 <div class="top-menu">
  <button class="top-menu-button" onclick="toggleMenu()">☰ メニュー</button>
  <div class="menu-panel" id="menuPanel" hidden>
   <button onclick="newGame();toggleMenu()">新しい局</button>
   <button onclick="sortHand();toggleMenu()">牌を整理</button>
   <button onclick="returnToMenu()">モード選択</button>
  </div>
 </div>
 <div class="status" id="status"></div>
 <div class="table">
  <div class="dora-area">
   <span class="dora-label">表示牌</span>
   <div class="dora-tile" id="doraIndicator">?</div>
   <span class="dora-arrow">▶</span>
   <div class="dora-result"><span class="dora-result-label">ドラ</span><div class="dora-tile actual-dora" id="doraTile">?</div></div>
  </div>
  <div class="player top" id="player3">
   <div class="name">CPU 3（北）</div><div class="backhand" id="back3"></div><div class="north-area" id="north3"></div><div class="meld-area" id="meld3"></div><div class="river" id="river3"></div>
  </div>
  <div class="player left"><div class="name">CPU 1（西）</div><div class="backhand" id="back1"></div><div class="north-area" id="north1"></div><div class="meld-area" id="meld1"></div><div class="river" id="river1"></div></div>
  <div class="player right"><div class="name">CPU 2（南）</div><div class="backhand" id="back2"></div><div class="north-area" id="north2"></div><div class="meld-area" id="meld2"></div><div class="river" id="river2"></div></div>
  <div class="player bottom"><div class="river" id="river0"></div><div class="north-area" id="north0"></div><div class="meld-area" id="meld0"></div><div class="name">あなた（東）</div></div>
  <div class="center-score score3" id="playerScore3">25000点</div>
  <div class="center-score score1" id="playerScore1">25000点</div>
  <div class="center-score score0" id="playerScore0">25000点</div>
  <div class="center-score score2" id="playerScore2">25000点</div>
  <div class="center"><div class="round" id="round">東一局</div><div style="font-size:25px;margin:6px">🀄</div><div id="wallinfo">残り牌：0</div></div>
 </div>
 <div class="handarea">
  <div class="handtitle"><span>あなたの手牌</span><span id="count">0枚</span></div>
  <div class="hand" id="hand"></div>
  <div class="call-actions" id="callActions" hidden>
   <button id="ponButton" onclick="playerCall('pon')">ポン</button>
   <button id="kanButton" onclick="playerCall('kan')">大明槓</button>
   <button id="chiButton" onclick="playerCall('chi')">チー</button>
   <button class="skip-call" onclick="skipCall()">スキップ</button>
  </div>
  <div class="actions">
   <button id="northButton" class="north-button" onclick="playerNorth()" hidden>北抜き</button>
   <button id="ankanButton" onclick="playerAnkan()" hidden>暗槓</button>
   <button id="riichiButton" class="riichi-button" onclick="playerRiichi()" hidden>リーチ</button>
   <button id="ronButton" class="win-button" onclick="playerRon()" hidden>ロン</button>
   <button id="tsumoButton" class="win-button" onclick="playerTsumo()" hidden>ツモ</button>
   <button id="passRonButton" class="pass-button" onclick="passRon()" hidden>見逃す</button>
   <button id="discard" onclick="playerDiscard()">打牌</button>
  </div>
 </div>
</div>
<script>
"use strict";
const honors=["東","南","西","北","白","發","中"];
const dragonTiles=["白","發","中"];
let mode=4,gameLength=4,wall=[],hands=[],rivers=[],extracted=[],melds=[];
let selected=-1,current=0,finished=false,busy=false,points=[],roundNo=1;
let gameToken=0,doraIndicator=null,dealer=0,honba=0,matchFinished=false;
let riichi=[],riichiPending=false,riichiSticks=0,pendingRon=null;
let drawnTile=[],temporaryFuriten=[],riichiTile=[],callPending=null;
let riichiNoticeTimer=null,riichiNoticeUntil=0,nextHandTimer=null;
let lastTapIndex=-1,lastTapTime=0;
const doubleTapDelay=350;

function activeSeats(){return mode===4?4:3}
function maxRounds(){return activeSeats()*(gameLength===4?1:2)}
function toggleMenu(){let e=document.getElementById("menuPanel");e.hidden=!e.hidden}
function status(s){document.getElementById("status").textContent=s}
function roundLabel(){
 const i=roundNo-1;
 return (["東","南"][Math.floor(i/activeSeats())]||"終了")+
 ["一","二","三","四"][i%activeSeats()]+"局";
}
function seatWind(p){return ["東","南","西","北"][(p-dealer+activeSeats())%activeSeats()]}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function makeWall(){
 let a=[];
 for(let s of ["m","p","s"]){
  let ns=mode===3&&s==="m"?[1,9]:[1,2,3,4,5,6,7,8,9];
  ns.forEach(n=>{for(let i=0;i<4;i++)a.push({s,n,red:n===5&&i===0})});
 }
 honors.forEach(n=>{for(let i=0;i<4;i++)a.push({s:"z",n})});
 return shuffle(a);
}
function key(t){return t.s==="z"?"z"+t.n:t.s+t.n}
function label(t){return t.s==="z"?t.n:t.n+({m:"萬",p:"筒",s:"索"}[t.s])}
function color(t){return t.red?"red":t.s==="z"?"blue":t.s==="m"?"red":t.s==="s"?"green":""}
function sortTiles(a){
 const o={m:0,p:1,s:2,z:3};
 a.sort((x,y)=>o[x.s]-o[y.s]||(x.s==="z"?honors.indexOf(x.n)-honors.indexOf(y.n):x.n-y.n));
}
function nextDora(t){
 if(t.s==="z"){
  let i=honors.indexOf(t.n);
  return {s:"z",n:i<4?honors[(i+1)%4]:honors[4+(i-4+1)%3]};
 }
 if(mode===3&&t.s==="m")return {s:"m",n:t.n===1?9:1};
 return {s:t.s,n:t.n===9?1:t.n+1};
}
function setMode(n){
 mode=n;
 document.getElementById("playerModeOptions").hidden=true;
 document.getElementById("lengthOptions").hidden=false;
}
function setLength(n){
 gameLength=n;points=Array(activeSeats()).fill(25000);
 roundNo=1;dealer=0;honba=0;riichiSticks=0;matchFinished=false;
 document.getElementById("startScreen").hidden=true;
 document.getElementById("gameScreen").hidden=false;
 newGame();
}
function returnToMenu(){
 gameToken++;clearTimeout(nextHandTimer);
 finished=true;busy=false;pendingRon=null;hideRiichiNotice();
 document.getElementById("resultPanel").hidden=true;
 document.getElementById("gameScreen").hidden=true;
 document.getElementById("startScreen").hidden=false;
 document.getElementById("playerModeOptions").hidden=false;
 document.getElementById("lengthOptions").hidden=true;
 matchFinished=false;
}
function showRiichiNotice(name){
 let e=document.getElementById("riichiNotice");
 document.getElementById("riichiNoticeSub").textContent=name;
 clearTimeout(riichiNoticeTimer);
 riichiNoticeUntil=Date.now()+2000;e.hidden=false;
 riichiNoticeTimer=setTimeout(()=>e.hidden=true,2000);
}
function hideRiichiNotice(){
 clearTimeout(riichiNoticeTimer);riichiNoticeUntil=0;
 document.getElementById("riichiNotice").hidden=true;
}
function afterRiichiNotice(fn,token){
 if(token!==gameToken||finished)return;
 let r=riichiNoticeUntil-Date.now();
 if(r>0){setTimeout(()=>afterRiichiNotice(fn,token),r+20);return}
 fn();
}
function closeResult(){
 clearTimeout(nextHandTimer);
 document.getElementById("resultPanel").hidden=true;
 if(matchFinished){returnToMenu();return}
 newGame();
}
function drawFor(p){
 if(!wall.length)return false;
 let t=wall.pop();hands[p].push(t);drawnTile[p]=t;
 if(p===0)temporaryFuriten[p]=false;
 return true;
}
function drawnIndex(p){return drawnTile[p]?hands[p].indexOf(drawnTile[p]):-1}
function isNorth(t){return t.s==="z"&&t.n==="北"}
function isSimple(t){return t.s!=="z"&&t.n>=2&&t.n<=8}
function isTerminal(t){return t.s!=="z"&&(t.n===1||t.n===9)}
function isYaochu(t){return t.s==="z"||isTerminal(t)}
function countKey(h,k){return h.filter(t=>key(t)===k).length}
function removeKey(h,k,n){
 for(let i=0;i<n;i++){let j=h.findIndex(t=>key(t)===k);if(j>=0)h.splice(j,1)}
}
function tileIndex(t){
 if(t.s==="m")return t.n-1;
 if(t.s==="p")return 9+t.n-1;
 if(t.s==="s")return 18+t.n-1;
 return 27+honors.indexOf(t.n);
}
function tileFromIndex(i){
 if(i<9)return {s:"m",n:i+1};
 if(i<18)return {s:"p",n:i-8};
 if(i<27)return {s:"s",n:i-17};
 return {s:"z",n:honors[i-27]};
}
function makeMelds(counts,tiles,groups,need){
 let i=counts.findIndex(v=>v>0);
 if(i<0)return groups.length===need;
 if(groups.length>need)return false;
 if(counts[i]>=3){
  counts[i]-=3;groups.push({type:"pon",tile:tiles[i]});
  if(makeMelds(counts,tiles,groups,need))return true;
  groups.pop();counts[i]+=3;
 }
 if(i<27&&i%9<=6&&counts[i+1]>0&&counts[i+2]>0){
  counts[i]--;counts[i+1]--;counts[i+2]--;
  groups.push({type:"chi",tile:tiles[i]});
  if(makeMelds(counts,tiles,groups,need))return true;
  groups.pop();counts[i]++;counts[i+1]++;counts[i+2]++;
 }
 return false;
}
function getAgariPatterns(hand,openCount=0){
 if(hand.length!==14-openCount*3)return [];
 let counts=Array(34).fill(0),tiles=Array(34);
 hand.forEach(t=>{let i=tileIndex(t);counts[i]++;tiles[i]=t});
 let out=[],need=4-openCount;
 if(!openCount&&counts.filter(x=>x===2).length===7&&counts.every(x=>x===0||x===2)){
  out.push({sevenPairs:true,pair:null,groups:[]});
 }
 for(let i=0;i<34;i++){
  if(counts[i]<2)continue;
  counts[i]-=2;
  let g=[];
  if(makeMelds(counts,tiles,g,need))out.push({sevenPairs:false,pair:tiles[i],groups:g.map(x=>({...x}))});
  counts[i]+=2;
 }
 return out;
}
function isClosed(p){return melds[p].every(m=>m.type==="ankan")}
function allTilesFor(hand,p){return hand.concat(...melds[p].map(m=>m.tiles))}
function groupList(pattern,p){
 return (pattern.groups||[]).concat(melds[p].map(m=>({
  type:m.type==="chi"?"chi":"pon",
  tile:m.tiles[0],
  open:m.type!=="ankan",
  kan:m.type==="ankan"||m.type==="minkan"
 })));
}
function isSequence(g){return g.type==="chi"}
function isTriplet(g){return g.type==="pon"}
function sequenceStart(g){return g.tile.n}
function valuePair(pair,p){
 if(!pair||pair.s!=="z")return 0;
 let v=0;
 if(dragonTiles.includes(pair.n))v+=2;
 if(pair.n===seatWind(p))v+=2;
 if(pair.n==="東")v+=2;
 return v;
}
function patternWait(pattern,winningTile){
 if(pattern.sevenPairs)return "tanki";
 if(!winningTile)return "";
 let groups=pattern.groups||[];
 for(let g of groups){
  if(g.type==="chi"&&g.tile.s===winningTile.s){
   let n=g.tile.n,w=winningTile.n;
   if(w===n+1)return "kanchan";
   if((n===1&&w===3)||(n===7&&w===7))return "penchan";
  }
 }
 return "unknown";
}
function isRyanmen(pattern,t){
 if(!t||pattern.sevenPairs)return false;
 return pattern.groups.some(g=>g.type==="chi"&&g.tile.s===t.s&&
  ((g.tile.n===t.n-1&&t.n<=8)||(g.tile.n===t.n-2&&t.n>=2)));
}
function countDora(hand,indicators){
 let total=0;
 let d=indicators.map(nextDora);
 hand.forEach(t=>{
  d.forEach(x=>{if(key(x)===key(t))total++});
  if(t.red)total++;
 });
 return total;
}
function yakumanCheck(all,pattern,groups,p){
 let y=[];
 const c={};all.forEach(t=>c[key(t)]=(c[key(t)]||0)+1);
 if(all.length>=14){
  let unique=new Set(all.map(key));
  let required=[1,9,10,18,19,27,28,29,30,31,32,33].map(i=>key(tileFromIndex(i)));
  if(required.every(k=>unique.has(k))&&required.some(k=>c[k]===2))y.push("国士無双");
 }
 if(all.every(t=>t.s==="z"))y.push("字一色");
 if(all.every(t=>isTerminal(t)))y.push("清老頭");
 if(all.every(t=>["s1","s2","s3","s4","s6","s8","z發"].includes(key(t))))y.push("緑一色");
 if(groups.filter(g=>g.type==="pon"&&!g.open).length===4&&pattern.pair)y.push("四暗刻");
 if(["白","發","中"].every(n=>groups.some(g=>g.type==="pon"&&g.tile.s==="z"&&g.tile.n===n)))y.push("大三元");
 let winds=["東","南","西","北"].filter(n=>groups.some(g=>g.type==="pon"&&g.tile.s==="z"&&g.tile.n===n)).length;
 if(winds===4)y.push("大四喜");
 else if(winds===3&&pattern.pair?.s==="z"&&["東","南","西","北"].includes(pattern.pair.n))y.push("小四喜");
 if(groups.filter(g=>g.kan).length===4)y.push("四槓子");
 return y;
}
function evaluatePattern(hand,pattern,p,isTsumo,winningTile){
 let all=allTilesFor(hand,p),groups=groupList(pattern,p),closed=isClosed(p),yaku=[];
 if(pattern.sevenPairs)yaku.push({name:"七対子",han:2});
 if(closed&&riichi[p])yaku.push({name:"リーチ",han:1});
 if(closed&&isTsumo)yaku.push({name:"門前ツモ",han:1});
 if(all.every(isSimple))yaku.push({name:"タンヤオ",han:1});
 if(groups.some(g=>g.type==="pon"&&g.tile.s==="z"&&dragonTiles.includes(g.tile.n))){
  [...new Set(groups.filter(g=>g.type==="pon"&&g.tile.s==="z"&&dragonTiles.includes(g.tile.n)).map(g=>g.tile.n))]
   .forEach(n=>yaku.push({name:"役牌 "+n,han:1}));
 }
 groups.filter(g=>g.type==="pon"&&g.tile.s==="z").forEach(g=>{
  if(g.tile.n===seatWind(p))yaku.push({name:"自風牌",han:1});
  if(g.tile.n==="東")yaku.push({name:"場風牌",han:1});
 });
 if(!pattern.sevenPairs){
  let seq=groups.filter(g=>g.type==="chi");
  let trip=groups.filter(g=>g.type==="pon");
  let pair=pattern.pair;
  if(closed&&seq.length===4&&pair?.s!=="z"&&isRyanmen(pattern,winningTile)&&
   !groups.some(g=>g.type==="pon"&&g.tile.s==="z"&&
   (dragonTiles.includes(g.tile.n)||g.tile.n===seatWind(p)||g.tile.n==="東"))){
   yaku.push({name:"平和",han:1});
  }
  let seqKeys=seq.map(g=>g.tile.s+g.tile.n);
  if(closed&&seqKeys.length===4){
   let dup=seqKeys.length-new Set(seqKeys).size;
   if(dup>=1)yaku.push({name:"一盃口",han:1});
   if(dup===2)yaku.push({name:"二盃口",han:3});
  }
  if(trip.length===4)yaku.push({name:"対々和",han:2});
  if(trip.filter(g=>!g.open).length>=3)yaku.push({name:"三暗刻",han:2});
  if(groups.filter(g=>g.kan).length>=3)yaku.push({name:"三槓子",han:2});
  if(seq.length===0&&trip.length===4&&all.every(isYaochu))yaku.push({name:"混老頭",han:2});
  if(all.some(t=>t.s==="z")&&all.every(isYaochu)&&groups.some(g=>g.type==="chi"))yaku.push({name:"混全帯么九",han:closed?2:1});
  if(all.every(t=>t.s!=="z")&&all.every(t=>t.n===1||t.n===9||groups.some(g=>g.type==="chi"&&g.tile.n===1&&t.s===g.tile.s))) {
   if(groups.every(g=>g.type==="pon"?isYaochu(g.tile):g.tile.n===1||g.tile.n===7))yaku.push({name:"純全帯么九",han:closed?3:2});
  }
  let suits=new Set(all.filter(t=>t.s!=="z").map(t=>t.s));
  let hasHonors=all.some(t=>t.s==="z");
  if(suits.size===1&&hasHonors)yaku.push({name:"混一色",han:closed?3:2});
  if(suits.size===1&&!hasHonors)yaku.push({name:"清一色",han:closed?6:5});
  let seqBySuit={};
  seq.forEach(g=>(seqBySuit[g.tile.s]??=[]).push(g.tile.n));
  if(["m","p","s"].every(s=>[1,4,7].some(n=>seqBySuit[s]?.includes(n))))yaku.push({name:"三色同順",han:closed?2:1});
  if(["m","p","s"].every(s=>seqBySuit[s]?.includes(1)&&seqBySuit[s]?.includes(4)&&seqBySuit[s]?.includes(7)))yaku.push({name:"一気通貫",han:closed?2:1});
  let tripNums={};
  trip.forEach(g=>{if(g.tile.s!=="z")(tripNums[g.tile.n]??=[]).push(g.tile.s)});
  if(Object.values(tripNums).some(a=>new Set(a).size===3))yaku.push({name:"三色同刻",han:2});
  if(trip.filter(g=>g.tile.s==="z"&&dragonTiles.includes(g.tile.n)).length===2&&pair?.s==="z"&&dragonTiles.includes(pair.n))yaku.push({name:"小三元",han:2});
 }
 let yakuman=yakumanCheck(all,pattern,groups,p);
 if(yakuman.length)return {yaku:yakuman.map(name=>({name,han:13})),han:13,yakuman:true,fu:0};
 if(!yaku.length)return null;
 let han=yaku.reduce((a,b)=>a+b.han,0);
 let dora=countDora(all,[doraIndicator]);
 if(riichi[p]&&isTsumo)dora+=0;
 if(dora)yaku.push({name:"ドラ",han:dora});
 let fu=calculateFu(pattern,groups,p,isTsumo,winningTile,yaku);
 return {yaku,han:han+dora,fu,yakuman:false};
}
function calculateFu(pattern,groups,p,isTsumo,winningTile,yaku){
 if(pattern.sevenPairs)return 25;
 let fu=20,closed=isClosed(p);
 if(!isTsumo&&closed)fu+=10;
 if(isTsumo)fu+=2;
 fu+=valuePair(pattern.pair,p);
 let wait=patternWait(pattern,winningTile);
 if(wait==="kanchan"||wait==="penchan"||wait==="tanki")fu+=2;
 groups.forEach(g=>{
  if(g.type!=="pon")return;
  let ya=isYaochu(g.tile),n=g.kan?4:3;
  let add=n===4?(ya?16:8):(ya?4:2);
  if(g.open)add/=2;
  fu+=add;
 });
 if(yaku.some(y=>y.name==="平和")&&isTsumo)return 20;
 if(yaku.some(y=>y.name==="平和")&&!isTsumo)return 30;
 return Math.ceil(fu/10)*10;
}
function canAgari(hand,extra,p,isTsumo){
 let full=extra?[...hand,extra]:hand.slice();
 let patterns=getAgariPatterns(full,melds[p].length);
 let best=null;
 for(let pattern of patterns){
  let r=evaluatePattern(full,pattern,p,isTsumo,extra||drawnTile[p]);
  if(r&&(!best||r.han*100+r.fu>best.han*100+best.fu))best={...r,pattern,hand:full};
 }
 return best;
}
function calculateShanten(hand,openCount=0){
 let c=Array(34).fill(0);hand.forEach(t=>c[tileIndex(t)]++);
 let best=8,need=4-openCount,memo=new Set();
 function dfs(m,t,p){
  m=Math.min(m,need);t=Math.min(t,need-m);
  let i=c.findIndex(x=>x>0);
  if(i<0){best=Math.min(best,2*need-2*m-t-p);return}
  let state=c.join("")+":"+m+":"+t+":"+p;
  if(memo.has(state))return;memo.add(state);
  c[i]--;dfs(m,t,p);c[i]++;
  if(c[i]>=3&&m<need){c[i]-=3;dfs(m+1,t,p);c[i]+=3}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]&&m<need){
   c[i]--;c[i+1]--;c[i+2]--;dfs(m+1,t,p);c[i]++;c[i+1]++;c[i+2]++;
  }
  if(c[i]>=2){c[i]-=2;if(!p)dfs(m,t,1);else dfs(m,t+1,p);c[i]+=2}
  if(i<27&&i%9<=7&&c[i+1]){c[i]--;c[i+1]--;dfs(m,t+1,p);c[i]++;c[i+1]++}
  if(i<27&&i%9<=6&&c[i+2]){c[i]--;c[i+2]--;dfs(m,t+1,p);c[i]++;c[i+2]++}
 }
 dfs(0,0,0);return best;
}
function isTenpai(hand,p){return calculateShanten(hand,melds[p].length)===0}
function canRiichiAfterDiscard(hand,index,p){
 if(riichi[p]||!isClosed(p)||points[p]<1000||index<0)return false;
 let h=hand.slice();h.splice(index,1);return isTenpai(h,p);
}

function chooseDiscard(h,p){
 if(riichi[p])return Math.max(0,drawnIndex(p));
 let best=0,bestScore=Infinity;
 for(let i=0;i<h.length;i++){
  let test=h.slice(),t=test.splice(i,1)[0];
  let sh=calculateShanten(test,melds[p].length);
  let same=countKey(test,key(t)),value=same*7;
  if(t.s==="z")value+=same?3:-2;
  else for(let q of test)if(q.s===t.s){
   let d=Math.abs(q.n-t.n);if(d===1)value+=2;if(d===2)value++;
  }
  let score=sh*100-value+Math.random()*.1;
  if(score<bestScore){bestScore=score;best=i;}
 }
 return best;
}

   cpuRi=true;showRiichiNotice("CPU "+p+" がリーチ！");

function getCallOptions(p,t,discarder){
 if(riichi[p])return [];
 let options=[];
 if(countKey(hands[p],key(t))>=2)options.push("pon");
 if(countKey(hands[p],key(t))>=3&&wall.length>0)options.push("kan");
 if(mode===4&&p===(discarder+1)%activeSeats()&&t.s!=="z"){
  for(let start=t.n-2;start<=t.n;start++){
   if(start<1||start>7)continue;
   let ns=[start,start+1,start+2].filter(n=>n!==t.n);
   if(ns.every(n=>hands[p].some(q=>q.s===t.s&&q.n===n))){options.push("chi");break;}
  }
 }
 return options;
}
function afterDiscard(discarder,t,token){
 if(token!==gameToken||finished)return;
 for(let step=1;step<activeSeats();step++){
  let p=(discarder+step)%activeSeats();
  if(p===0&&temporaryFuriten[0])continue;
  let r=canAgari(hands[p],t,p,false);if(!r)continue;
  if(p===0){
   pendingRon={player:0,discarder,tile:t,result:r,token};
   busy=false;status("ロンできます！");update();return;
  }
  winGame(p,"ロン",r,discarder);return;
 }
 let candidates=[];
 for(let step=1;step<activeSeats();step++){
  let p=(discarder+step)%activeSeats(),opts=getCallOptions(p,t,discarder);
  if(opts.length)candidates.push({p,opts,step});
 }
 candidates.sort((a,b)=>{
  let rank=x=>x.opts.includes("pon")||x.opts.includes("kan")?0:1;
  return rank(a)-rank(b)||a.step-b.step;
 });
 if(!candidates.length){advanceTurn(discarder,token);return;}
 let c=candidates[0];
 if(c.p===0){
  callPending={player:0,discarder,tile:t,options:c.opts,token};
  busy=false;status("鳴くことができます。");update();return;
 }
 let call=c.opts.includes("kan")?"kan":c.opts.includes("pon")?"pon":"chi";
 executeCall(c.p,call,discarder,t,token);
}

  let opts=getCallOptions(p,c.tile,c.discarder);
  if(opts.length)candidates.push({p,opts,step});
 }
 candidates.sort((a,b)=>{
  let rank=x=>x.opts.includes("pon")||x.opts.includes("kan")?0:1;
  return rank(a)-rank(b)||a.step-b.step;
 });
 if(candidates.length){
  let x=candidates[0],call=x.opts.includes("kan")?"kan":x.opts.includes("pon")?"pon":"chi";
  executeCall(x.p,call,c.discarder,c.tile,c.token);
 }else advanceTurn(c.discarder,c.token);
}
function executeCall(p,type,discarder,t,token){
 if(token!==gameToken||finished)return;
 let tiles=[t];
 if(type==="pon"){removeKey(hands[p],key(t),2);tiles.push(t,t);}
 if(type==="kan"){removeKey(hands[p],key(t),3);tiles.push(t,t,t);}
 if(type==="chi"){
  let chosen=null;
  for(let start=t.n-2;start<=t.n;start++){
   if(start<1||start>7)continue;
   let ns=[start,start+1,start+2].filter(n=>n!==t.n);
   let found=ns.map(n=>hands[p].find(q=>q.s===t.s&&q.n===n));
   if(found.every(Boolean)){chosen=found;break;}
  }
  if(!chosen){advanceTurn(discarder,token);return;}
  chosen.forEach(q=>{hands[p].splice(hands[p].indexOf(q),1);tiles.push(q);});
 }
 melds[p].push({type:type==="kan"?"minkan":type,tiles,from:discarder});
 drawnTile[p]=null;current=p;selected=-1;busy=p!==0;
 if(type==="kan"&&!drawFor(p)){endGame("嶺上牌がありません。");return;}
 sortTiles(hands[p]);update();
 if(p===0){busy=false;status(type==="pon"?"ポンしました。牌を捨ててください。":type==="chi"?"チーしました。牌を捨ててください。":"大明槓しました。嶺上牌を引きました。");return;}
 status("CPU "+p+" が"+(type==="pon"?"ポン":type==="chi"?"チー":"大明槓")+"しました。");
 setTimeout(()=>cpuDiscardAfterCall(p,token),500);
}
function cpuDiscardAfterCall(p,token){
 if(token!==gameToken||finished)return;
 let i=chooseDiscard(hands[p],p),t=hands[p].splice(i,1)[0];
 drawnTile[p]=null;rivers[p].push(t);update();afterDiscard(p,t,token);
}
function advanceTurn(discarder,token){
 if(token!==gameToken||finished)return;
 current=(discarder+1)%activeSeats();
 if(current===0)setTimeout(()=>{if(token===gameToken)startPlayerTurn();},350);
 else{busy=true;setTimeout(()=>{if(token===gameToken)cpuTurn(token);},450);}
}
function playerRon(){
 if(!pendingRon||pendingRon.player!==0)return;
 let r=pendingRon.result,l=pendingRon.discarder;pendingRon=null;
 winGame(0,"ロン",r,l);
}
function passRon(){
 if(!pendingRon)return;
 let c=pendingRon;pendingRon=null;temporaryFuriten[0]=true;
 busy=true;status("ロンを見逃しました。");
 advanceTurn(c.discarder,c.token);update();
}
function playerTsumo(){
 if(finished||busy||current!==0)return;
 let r=canAgari(hands[0],null,0,true);if(r)winGame(0,"ツモ",r);
}
function round100(n){return Math.ceil(n/100)*100;}
function basicPoints(han,fu){
 if(han>=13)return 8000;
 if(han>=11)return 6000;
 if(han>=8)return 4000;
 if(han>=6)return 3000;
 let base=fu*Math.pow(2,han+2);
 if(han>=5||base>=2000)return 2000;
 return base;
}
function calculateScore(result,type,winner,loser){
 let han=result.han,fu=result.fu||0,base=basicPoints(han,fu);
 let transfers=[],total=0,dealerWin=winner===dealer;
 if(type==="ロン"){
  let pay=round100(base*(dealerWin?6:4))+honba*300;
  if(loser!=null){points[loser]-=pay;points[winner]+=pay;transfers.push({from:loser,to:winner,amount:pay});total=pay;}
 }else{
  for(let p=0;p<activeSeats();p++)if(p!==winner){
   let pay=round100(base*(dealerWin?2:(p===dealer?2:1)));
   pay+=honba*100;
   points[p]-=pay;points[winner]+=pay;
   transfers.push({from:p,to:winner,amount:pay});total+=pay;
  }
 }
 return {han,fu,total,transfers};
}
function playerName(p){return p===0?"あなた":"CPU "+p;}
function showResult(winner,type,result,score){
 document.getElementById("resultTitle").textContent=playerName(winner)+"の"+type+"！";
 let names=result.yaku.map(y=>y.name+" "+y.han+"翻").join("・");
 let html='<div class="result-main">'+score.han+'翻 '+score.fu+'符</div>'+
 '<div class="result-detail">'+names+'<br><strong>獲得点数：'+score.total.toLocaleString()+'点</strong></div>'+
 '<div class="result-line"><strong>点数移動</strong></div>';
 score.transfers.forEach(t=>{
  html+='<div class="result-line"><span>'+playerName(t.from)+' → '+playerName(t.to)+'</span><strong>+'+t.amount.toLocaleString()+'点</strong></div>';
 });
 if(riichiSticks){
  let b=riichiSticks*1000;points[winner]+=b;
  html+='<div class="result-line"><span>リーチ供託</span><strong>+'+b.toLocaleString()+'点</strong></div>';
  score.total+=b;riichiSticks=0;
 }
 html+='<div class="result-line"><strong>対局終了後の持ち点</strong></div>';
 for(let p=0;p<activeSeats();p++){
  html+='<div class="result-line"><span>'+playerName(p)+'</span><strong>'+points[p].toLocaleString()+'点</strong></div>';
 }
 document.getElementById("resultBody").innerHTML=html;
 document.getElementById("resultPanel").hidden=false;
}
function advanceRound(winner){
 if(winner===dealer)honba++;
 else{dealer=(dealer+1)%activeSeats();roundNo++;honba=0;}
 if(roundNo>maxRounds())matchFinished=true;
}
function winGame(winner,type,result,loser){
 if(finished)return;
 finished=true;busy=false;pendingRon=null;callPending=null;riichiPending=false;
 let score=calculateScore(result,type,winner,loser);
 advanceRound(winner);status(playerName(winner)+"の"+type+"！");update();
 showResult(winner,type,result,score);
 document.querySelector(".result-close").textContent=matchFinished?"モード選択":"次の局へ";
 let token=gameToken;clearTimeout(nextHandTimer);
 nextHandTimer=setTimeout(()=>{if(token===gameToken)closeResult();},3000);
}
function endGame(message){
 if(finished)return;
 finished=true;busy=false;pendingRon=null;callPending=null;
 let tenpai=[];
 for(let p=0;p<activeSeats();p++)if(isTenpai(hands[p],p))tenpai.push(p);
 let noten=activeSeats()-tenpai.length;
 if(tenpai.length>0&&noten>0){
  let gain=Math.floor(3000/tenpai.length),loss=Math.floor(3000/noten);
  tenpai.forEach(p=>points[p]+=gain);
  for(let p=0;p<activeSeats();p++)if(!tenpai.includes(p))points[p]-=loss;
 }
 if(dealer===0&&tenpai.includes(0)||dealer!==0&&!tenpai.includes(dealer))honba++;
 else{dealer=(dealer+1)%activeSeats();roundNo++;honba=0;}
 if(roundNo>maxRounds())matchFinished=true;
 status(message);update();
 document.getElementById("resultTitle").textContent="流局";
 let html='<div class="result-detail">'+message+'<br>テンパイ：'+
 (tenpai.length?tenpai.map(playerName).join("・"):"なし")+'</div>';
 for(let p=0;p<activeSeats();p++)html+='<div class="result-line"><span>'+playerName(p)+'</span><strong>'+points[p].toLocaleString()+'点</strong></div>';
 document.getElementById("resultBody").innerHTML=html;
 document.getElementById("resultPanel").hidden=false;
 document.querySelector(".result-close").textContent=matchFinished?"モード選択":"次の局へ";
 let token=gameToken;clearTimeout(nextHandTimer);
 nextHandTimer=setTimeout(()=>{if(token===gameToken)closeResult();},3000);
}
function startPlayerTurn(){
 if(finished)return;current=0;
 if(!drawFor(0)){endGame("山牌がなくなりました。流局です。");return;}
 sortTiles(hands[0]);selected=-1;lastTapIndex=-1;lastTapTime=0;
 let ts=canAgari(hands[0],null,0,true);
 if(riichi[0]&&!ts){
  busy=true;status("リーチ中：自動ツモ切りします。");update();
  let token=gameToken;
  setTimeout(()=>{
   if(token!==gameToken||finished)return;
   let i=drawnIndex(0);if(i<0)return;
   let t=hands[0].splice(i,1)[0];drawnTile[0]=null;
   rivers[0].push(t);busy=true;update();afterDiscard(0,t,token);
  },450);
  return;
 }
 busy=false;status(ts?"ツモできます！":"");update();
}
function sortHand(){
 if(finished||busy||pendingRon||callPending||riichi[0])return;
 sortTiles(hands[0]);selected=-1;lastTapIndex=-1;lastTapTime=0;update();
}
</script>
