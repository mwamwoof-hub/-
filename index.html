
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123c30">
<title>MAHJONG QUEST</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#102b24;
 color:white;
 font-family:Arial,"Noto Sans JP",sans-serif;
 user-select:none;
}
button{cursor:pointer;font:inherit}

header{
 text-align:center;
 padding:12px;
 background:#10251f;
}
h1{margin:0;color:#e5c77a;font-size:21px}

.menu{
 display:flex;
 justify-content:center;
 gap:8px;
 padding:9px;
 background:#193a30;
}
.menu button{
 padding:9px 15px;
 border:1px solid #80998b;
 border-radius:8px;
 background:#294e40;
 color:white;
}
.menu .active{
 background:#d2ae58;
 color:#172b22;
}

.status{
 text-align:center;
 padding:9px;
 color:#f1d98c;
 font-weight:bold;
 min-height:36px;
}

.table{
 position:relative;
 width:96%;
 max-width:480px;
 height:470px;
 margin:5px auto;
 background:radial-gradient(ellipse,#26815b,#125039);
 border:9px solid #704b2e;
 border-radius:24px;
 box-shadow:0 5px 18px #0008;
}

.player{
 position:absolute;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:4px;
 font-size:12px;
}
.name{color:#f5e3a8;font-weight:bold}

.top{
 top:7px;
 left:50%;
 transform:translateX(-50%);
}
.left{left:4px;top:40%}
.right{right:4px;top:40%}

.backhand{
 display:flex;
 gap:2px;
}
.back{
 width:11px;
 height:21px;
 border:1px solid #d4c08b;
 background:#286c50;
 border-radius:2px;
}

.river{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:2px;
 max-width:135px;
}

.tile{
 flex:0 0 auto;
 width:clamp(21px,6.1vw,31px);
 height:clamp(38px,10vw,49px);
 background:#f5f0dc;
 color:#222;
 border:1px solid #b8ad91;
 border-radius:4px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:clamp(13px,3.8vw,20px);
 font-weight:bold;
 box-shadow:0 2px 2px #0006;
}
.smalltile{
 width:19px;
 height:26px;
 font-size:12px;
}
.red{color:#c52b27}
.green{color:#168348}
.blue{color:#2566b4}

.selected{
 transform:translateY(-8px);
 border:2px solid #e9b94e;
}

.center{
 position:absolute;
 top:39%;
 left:50%;
 transform:translate(-50%,-50%);
 text-align:center;
 width:60%;
}
.round{color:#f6e5ad;font-size:16px}
.centerinfo{font-size:12px;margin-top:7px}

.log{
 margin:8px auto 190px;
 width:94%;
 max-width:460px;
 height:55px;
 overflow:auto;
 background:#172d26;
 border-radius:8px;
 padding:7px;
 font-size:11px;
 color:#c6d6c9;
}

.handarea{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#172d26;
 padding:9px 3px calc(10px + env(safe-area-inset-bottom));
 border-top:2px solid #8b7047;
 z-index:5;
}
.handtitle{
 display:flex;
 justify-content:space-between;
 padding:0 7px 7px;
 font-size:12px;
 color:#e6d5a6;
}
.hand{
 display:flex;
 justify-content:center;
 gap:2px;
 overflow-x:auto;
 padding:4px 0 9px;
}
.actions,.subactions{
 display:flex;
 justify-content:center;
 gap:7px;
 flex-wrap:wrap;
}
.actions button{
 padding:10px 25px;
 border:0;
 border-radius:7px;
 background:#d1ae5e;
 color:#1c2c23;
 font-weight:bold;
}
.actions button:disabled{opacity:.35}
.subactions{margin-top:7px}
.subactions button{
 padding:7px 12px;
 background:#345d4b;
 color:white;
 border:1px solid #8ca696;
 border-radius:7px;
 font-size:12px;
}

@media(max-height:700px){
 .table{height:380px}
}
</style>
</head>

<body>

<header>
<h1>🀄 MAHJONG QUEST</h1>
<small>REALISTIC JAPANESE MAHJONG</small>
</header>

<div class="menu">
<button id="four" class="active" onclick="setMode(4)">四人麻雀</button>
<button id="three" onclick="setMode(3)">三人麻雀</button>
</div>

<div class="status" id="status">対局準備中</div>

<div class="table">

 <div class="player top">
  <div class="name">CPU 2</div>
  <div class="backhand" id="back2"></div>
  <div class="river" id="river2"></div>
 </div>

 <div class="player left" id="player3">
  <div class="name">CPU 3</div>
  <div class="backhand" id="back3"></div>
  <div class="river" id="river3"></div>
 </div>

 <div class="player right">
  <div class="name">CPU 1</div>
  <div class="backhand" id="back1"></div>
  <div class="river" id="river1"></div>
 </div>

 <div class="center">
  <div class="round" id="round">東一局</div>
  <div style="font-size:27px;margin:8px">🀄</div>
  <div id="wallinfo">残り牌：0</div>
  <div class="centerinfo" id="score">あなた 25000点</div>
  <div class="centerinfo" id="turninfo">対局準備中</div>
 </div>

</div>

<div class="log" id="log">
対局を開始してください。
</div>

<div class="handarea">

 <div class="handtitle">
  <span>あなたの手牌</span>
  <span id="count">0枚</span>
 </div>

 <div class="hand" id="hand"></div>

 <div class="actions">
  <button id="discard" onclick="playerDiscard()">打牌</button>
 </div>

 <div class="subactions">
  <button onclick="newGame()">新しい局</button>
  <button onclick="sortHand()">牌を整理</button>
 </div>

</div>

<script>
const honors=["東","南","西","北","白","發","中"];

let mode=4;
let wall=[];
let hands=[];
let rivers=[];
let selected=-1;
let current=0;
let finished=false;
let busy=false;
let points=25000;
let roundNo=1;
let gameToken=0;

function activeSeats(){
 return mode===4?4:3;
}

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function makeWall(){
 let a=[];

 for(let s of ["m","p","s"]){
  let nums=mode===3&&s==="m"
   ?[1,9]
   :[1,2,3,4,5,6,7,8,9];

  nums.forEach(n=>{
   for(let i=0;i<4;i++){
    a.push({s,n});
   }
  });
 }

 honors.forEach(n=>{
  for(let i=0;i<4;i++){
   a.push({s:"z",n});
  }
 });

 return shuffle(a);
}

function key(t){
 return t.s==="z"?t.n:t.s+t.n;
}

function label(t){
 if(t.s==="z")return t.n;
 return t.n+({m:"萬",p:"筒",s:"索"}[t.s]);
}

function color(t){
 if(t.s==="z")return "blue";
 if(t.s==="m")return "red";
 if(t.s==="s")return "green";
 return "";
}

function sortTiles(a){
 a.sort((x,y)=>{
  const order={m:0,p:1,s:2,z:3};

  if(order[x.s]!==order[y.s]){
   return order[x.s]-order[y.s];
  }

  if(x.s==="z"){
   return honors.indexOf(x.n)-honors.indexOf(y.n);
  }

  return x.n-y.n;
 });
}

function setMode(n){
 mode=n;

 document.getElementById("four")
  .classList.toggle("active",n===4);

 document.getElementById("three")
  .classList.toggle("active",n===3);

 newGame();
}

function status(s){
 document.getElementById("status").textContent=s;
}

function log(s){
 const e=document.getElementById("log");
 e.innerHTML+=s+"<br>";
 e.scrollTop=e.scrollHeight;
}

function newGame(){
 gameToken++;

 wall=makeWall();

 hands=Array.from(
  {length:activeSeats()},
  ()=>[]
 );

 rivers=Array.from(
  {length:activeSeats()},
  ()=>[]
 );

 selected=-1;
 current=0;
 finished=false;
 busy=true;

 for(let i=0;i<13;i++){
  for(let p=0;p<activeSeats();p++){
   hands[p].push(wall.pop());
  }
 }

 hands.forEach(sortTiles);

 document.getElementById("log").innerHTML="";

 log("新しい局を開始しました。");

 if(mode===4){
  document.getElementById("player3").style.display="flex";
 }else{
  document.getElementById("player3").style.display="none";
 }

 status("あなたが自動ツモ中...");

 update();

 // 最初のプレイヤーのツモ
 setTimeout(()=>{
  if(finished)return;

  if(!drawFor(0)){
   endGame("流局です。");
   return;
  }

  busy=false;
  selected=-1;
  sortTiles(hands[0]);

  log("あなたが自動ツモしました。");
  status("あなたの番です。牌を選んで打牌してください。");

  update();
 },400);
}

function drawFor(p){
 if(wall.length===0)return false;

 hands[p].push(wall.pop());

 return true;
}

function update(){
 const el=document.getElementById("hand");

 el.innerHTML="";

 hands[0].forEach((t,i)=>{
  let d=document.createElement("div");

  d.className="tile "+color(t)+
   (selected===i?" selected":"");

  d.textContent=label(t);

  d.onclick=()=>{
   if(current!==0||busy||finished||
      hands[0].length!==14)return;

   selected=i;
   update();
  };

  el.appendChild(d);
 });

 document.getElementById("count").textContent=
  hands[0].length+"枚";

 document.getElementById("wallinfo").textContent=
  "残り牌："+wall.length;

 document.getElementById("score").textContent=
  "あなた "+points+"点";

 document.getElementById("round").textContent=
  "東"+["一","二","三","四"][(roundNo-1)%4]+"局";

 for(let p=1;p<4;p++){
  const backs=document.getElementById("back"+p);
  const river=document.getElementById("river"+p);

  backs.innerHTML="";
  river.innerHTML="";

  if(p>=activeSeats())continue;

  hands[p].forEach(()=>{
   let b=document.createElement("div");
   b.className="back";
   backs.appendChild(b);
  });

  rivers[p].forEach(t=>{
   let d=document.createElement("div");

   d.className="tile smalltile "+color(t);
   d.textContent=label(t);

   river.appendChild(d);
  });
 }

 const humanRiver=document.getElementById("river1");
 humanRiver.innerHTML="";

 rivers[0].forEach(t=>{
  let d=document.createElement("div");

  d.className="tile smalltile "+color(t);
  d.textContent=label(t);

  humanRiver.appendChild(d);
 });

 document.getElementById("discard").disabled=
  finished||
  busy||
  current!==0||
  hands[0].length!==14||
  selected<0;
}

function playerDiscard(){
 if(finished||busy||current!==0||
    hands[0].length!==14||selected<0)return;

 const t=hands[0].splice(selected,1)[0];

 rivers[0].push(t);

 selected=-1;
 current=1;
 busy=true;

 log("あなた："+label(t)+"を打牌");

 status("CPUが対局中...");

 update();

 const token=gameToken;

 setTimeout(()=>{
  if(token!==gameToken)return;
  cpuTurn(token);
 },500);
}

function chooseDiscard(h){
 let counts={};

 h.forEach(t=>{
  counts[key(t)]=(counts[key(t)]||0)+1;
 });

 let best=0;
 let bestScore=999;

 for(let i=0;i<h.length;i++){
  const t=h[i];
  const k=key(t);

  let score=0;

  if(counts[k]>=2)score+=8;

  if(t.s==="z"){
   score+=counts[k]===1?0:4;
  }else{
   let near=0;

   for(let j=0;j<h.length;j++){
    const q=h[j];

    if(q.s===t.s&&
       Math.abs(q.n-t.n)<=2&&i!==j){
     near++;
    }
   }

   score+=near*3;

   if(t.n===1||t.n===9)score+=1;
  }

  score+=Math.random()*0.2;

  if(score<bestScore){
   bestScore=score;
   best=i;
  }
 }

 return best;
}

function cpuTurn(token){
 if(token!==gameToken||finished)return;

 const p=current;

 if(p>=activeSeats()){
  startPlayerTurn();
  return;
 }

 // CPUが自動ツモ
 if(!drawFor(p)){
  endGame("山牌がなくなりました。流局です。");
  return;
 }

 sortTiles(hands[p]);

 // CPUが牌を選んで打牌
 const i=chooseDiscard(hands[p]);
 const t=hands[p].splice(i,1)[0];

 rivers[p].push(t);

 log("CPU "+p+"："+label(t)+"を打牌");

 current++;

 update();

 // 次のCPUへ
 if(current<activeSeats()){
  setTimeout(()=>{
   if(token!==gameToken)return;
   cpuTurn(token);
  },500);
 }else{
  // CPU全員終了後、自動であなたがツモ
  setTimeout(()=>{
   if(token!==gameToken)return;
   startPlayerTurn();
  },400);
 }
}

function startPlayerTurn(){
 if(finished)return;

 current=0;

 if(!drawFor(0)){
  endGame("山牌がなくなりました。流局です。");
  return;
 }

 sortTiles(hands[0]);

 selected=-1;
 busy=false;

 log("あなたが自動ツモしました。");

 status("あなたの番です。牌を選んで打牌してください。");

 update();
}

function sortHand(){
 if(finished||busy)return;

 sortTiles(hands[0]);
 selected=-1;

 update();
}

function endGame(s){
 finished=true;
 busy=false;

 status(s);
 log(s);

 update();
}

newGame();
</script>

</body>
</html>
